<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="栖薇 · Seraphine" />
  <title>Seraphine · 栖薇的琉璃玫瑰圣堂档案夹</title>
  <meta name="description" content="Seraphine · 栖薇的圣咏残章：纯代码生成的金丝琉璃玫瑰与哥特花窗磨砂档案夹，支持晨曦欧泊与午夜圣血双色切换、丁达尔微光散景、荆棘物理摇曳与花瓣风暴。" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      --ink-glow: rgba(255, 224, 186, 0.28);
      --sub-color: rgba(242, 232, 240, 0.74);
      --sub-drop-color: rgba(255, 232, 192, 0.96);
      --sub-drop-glow: rgba(255, 204, 140, 0.58);
      --card-bg-1: rgba(208, 188, 236, 0.34);
      --card-bg-2: rgba(154, 152, 214, 0.26);
      --card-bg-3: rgba(96, 78, 128, 0.34);
      --card-border: rgba(255, 232, 204, 0.42);
      --card-hover-1: rgba(236, 206, 248, 0.50);
      --card-hover-2: rgba(178, 182, 242, 0.42);
      --card-hover-3: rgba(128, 98, 168, 0.46);
      --card-hover-border: rgba(255, 240, 212, 0.85);
      --card-hover-glow: rgba(255, 210, 168, 0.30);
    }

    body.theme-crimson {
      --ink-glow: rgba(255, 196, 136, 0.32);
      --sub-color: rgba(240, 218, 224, 0.76);
      --sub-drop-color: rgba(255, 218, 166, 0.98);
      --sub-drop-glow: rgba(235, 130, 150, 0.62);
      --card-bg-1: rgba(168, 52, 92, 0.36);
      --card-bg-2: rgba(98, 46, 124, 0.30);
      --card-bg-3: rgba(48, 28, 68, 0.42);
      --card-border: rgba(238, 196, 138, 0.46);
      --card-hover-1: rgba(206, 68, 112, 0.54);
      --card-hover-2: rgba(126, 58, 158, 0.46);
      --card-hover-3: rgba(68, 34, 96, 0.52);
      --card-hover-border: rgba(255, 222, 162, 0.90);
      --card-hover-glow: rgba(228, 96, 136, 0.36);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 620px;
      background: #000000;
      color: rgba(250, 244, 248, 0.94);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "Cormorant Garamond", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    @media (hover: hover) and (pointer: fine) {
      html, body, button, .card-item {
        cursor: none !important;
      }
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 620px;
      background: #000000;
      overflow: hidden;
    }

    canvas#scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* 3D Perspective Overlay locked to the Folder Front Cover */
    #folder-3d-anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      pointer-events: none;
      z-index: 3;
      perspective: 900px;
      -webkit-perspective: 900px;
    }

    #cover-face-ui {
      position: absolute;
      inset: 0;
      transform-origin: 50% 100%;
      -webkit-transform-origin: 50% 100%;
      will-change: transform, opacity;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 26px 19px 25px;
    }

    .cover-bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    #title-wrap {
      position: relative;
      height: 60px;
      display: flex;
      align-items: flex-end;
      filter: drop-shadow(0 2px 12px var(--ink-glow));
      transition: opacity 0.25s ease;
    }

    .font-v1 #svg-calligraphy { display: block; }
    .font-v1 #text-calligraphy { display: none; }

    .font-v2 #svg-calligraphy,
    .font-v3 #svg-calligraphy,
    .font-v4 #svg-calligraphy { display: none; }

    #text-calligraphy {
      display: none;
      color: rgba(252, 247, 244, 0.95);
      line-height: 1;
      white-space: nowrap;
    }

    .font-v2 #text-calligraphy {
      display: block;
      font-family: "Snell Roundhand", "Apple Chancery", "Zapfino", "URW Chancery L", "Georgia", cursive, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 39px;
      letter-spacing: 0.03em;
    }

    .font-v3 #text-calligraphy {
      display: block;
      font-family: "Didot", "Bodoni MT", "Cormorant Garamond", "Baskerville", "Times New Roman", serif;
      font-style: italic;
      font-weight: 300;
      font-size: 37px;
      letter-spacing: 0.07em;
    }

    .font-v4 #text-calligraphy {
      display: block;
      font-family: "Optima", "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 200;
      font-size: 27px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding-bottom: 4px;
    }

    .subtitle-box {
      position: relative;
      height: 19px;
      min-width: 220px;
    }

    .subtitle-line {
      position: absolute;
      left: 4px;
      top: 0;
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
      font-size: 12px;
      letter-spacing: 0.26em;
      color: var(--sub-color);
      white-space: nowrap;
      transition: opacity 0.28s ease, transform 0.28s ease, color 0.28s ease;
    }

    #subtitle-drop {
      opacity: 0;
      transform: translateY(5px);
      color: var(--sub-drop-color);
      text-shadow: 0 0 12px var(--sub-drop-glow);
    }

    body.dragging-near #subtitle-normal {
      opacity: 0;
      transform: translateY(-5px);
    }

    body.dragging-near #subtitle-drop {
      opacity: 1;
      transform: translateY(0);
    }

    /* Image 3's Gothic Cathedral Rose Window Arch with Embedded Rose! */
    .seal-icon {
      width: 28px;
      height: 40px;
      opacity: 0.88;
      flex-shrink: 0;
      filter: drop-shadow(0 0 7px rgba(255, 224, 190, 0.28));
    }

    /* Specimen / Scripture Card Fan Layer */
    #card-fan-layer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 5;
      pointer-events: none;
    }

    #card-fan-layer.open {
      pointer-events: auto;
    }

    .card-item {
      position: absolute;
      left: 0;
      top: 0;
      width: 82px;
      height: 122px;
      margin-left: -41px;
      margin-top: -61px;
      border-radius: 11px;
      background: linear-gradient(
        160deg,
        var(--card-bg-1) 0%,
        var(--card-bg-2) 52%,
        var(--card-bg-3) 100%
      );
      backdrop-filter: blur(13px) saturate(1.25);
      -webkit-backdrop-filter: blur(13px) saturate(1.25);
      border: 1px solid var(--card-border);
      box-shadow:
        0 10px 28px rgba(10, 4, 18, 0.62),
        inset 0 1px 0 rgba(255, 245, 228, 0.42);
      transform-origin: 50% 50%;
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.46s cubic-bezier(0.2, 0.88, 0.26, 1),
        opacity 0.30s ease,
        background 0.26s ease,
        border-color 0.26s ease,
        box-shadow 0.26s ease;
      padding: 9px 9px 10px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    #card-fan-layer.open .card-item {
      opacity: 1;
      pointer-events: auto;
    }

    .card-item.active,
    .card-item:hover {
      background: linear-gradient(
        160deg,
        var(--card-hover-1) 0%,
        var(--card-hover-2) 52%,
        var(--card-hover-3) 100%
      );
      border-color: var(--card-hover-border);
      box-shadow:
        0 16px 36px rgba(18, 6, 28, 0.76),
        0 0 22px var(--card-hover-glow),
        inset 0 1px 0 rgba(255, 250, 238, 0.72);
      z-index: 35 !important;
    }

    .card-item.deleting {
      opacity: 0 !important;
      transform: translateY(-46px) scale(0.76) !important;
      pointer-events: none !important;
      transition: transform 0.32s ease, opacity 0.28s ease !important;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 18px;
    }

    .card-mini-mark {
      width: 11px;
      height: 15px;
      opacity: 0.72;
    }

    .card-del-btn {
      appearance: none;
      border: 1px solid rgba(255, 232, 198, 0.38);
      background: rgba(28, 14, 34, 0.62);
      color: rgba(255, 246, 238, 0.96);
      font-family: "PingFang SC", "Songti SC", sans-serif;
      font-size: 10px;
      line-height: 1;
      padding: 3px 6.5px;
      border-radius: 999px;
      opacity: 0;
      transform: scale(0.86);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }

    .card-item.active .card-del-btn,
    .card-item:hover .card-del-btn {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-del-btn:hover,
    .card-del-btn:active {
      background: rgba(196, 56, 98, 0.78);
      border-color: rgba(255, 222, 196, 0.85);
    }

    .card-ext {
      font-family: "Cormorant Garamond", "Baskerville", Georgia, serif;
      font-style: italic;
      font-size: 18px;
      letter-spacing: 0.03em;
      color: rgba(255, 248, 242, 0.95);
      margin-top: -2px;
    }

    .card-name {
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      color: rgba(248, 238, 244, 0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      z-index: 2;
    }

    .card-watermark {
      position: absolute;
      right: -2px;
      bottom: 7px;
      width: 24px;
      height: 34px;
      opacity: 0.17;
      pointer-events: none;
    }

    /* Top-Right Whisper Controls */
    #top-bar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top, 14px));
      right: max(14px, env(safe-area-inset-right, 14px));
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;
      opacity: 0.38;
      transition: opacity 0.3s ease;
    }

    #top-bar:hover,
    #top-bar:focus-within {
      opacity: 0.96;
    }

    body.zen-mode #top-bar,
    body.zen-mode #hint-whisper {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .pill-ctrl {
      appearance: none;
      background: rgba(24, 16, 32, 0.62);
      border: 1px solid rgba(242, 214, 184, 0.26);
      color: rgba(246, 236, 242, 0.86);
      font-family: "Songti SC", "PingFang SC", serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 4px 8.5px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.22s ease, color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .pill-ctrl.active,
    .pill-ctrl:hover {
      border-color: rgba(255, 224, 178, 0.78);
      color: #ffffff;
      background: rgba(76, 48, 92, 0.68);
      box-shadow: 0 0 10px rgba(255, 212, 164, 0.18);
    }

    body.theme-crimson .pill-ctrl.active {
      border-color: rgba(246, 198, 128, 0.85);
      background: rgba(116, 28, 62, 0.72);
      box-shadow: 0 0 12px rgba(218, 72, 114, 0.28);
    }

    .ctrl-sep {
      width: 1px;
      height: 12px;
      background: rgba(255, 228, 196, 0.22);
      margin: 0 2px;
    }

    #hint-whisper {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(232, 214, 228, 0.28);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    @media (max-width: 560px) {
      #cover-face-ui {
        padding: 14px 18px 13px 16px;
      }
      #title-wrap {
        height: 48px;
      }
      #svg-calligraphy {
        width: 184px;
        height: 48px;
      }
      .font-v2 #text-calligraphy { font-size: 31px; }
      .font-v3 #text-calligraphy { font-size: 29px; }
      .font-v4 #text-calligraphy { font-size: 21px; }
      .subtitle-line {
        font-size: 10.5px;
        letter-spacing: 0.18em;
      }
      .seal-icon {
        width: 23px;
        height: 33px;
      }
      .card-item {
        width: 62px;
        height: 96px;
        margin-left: -31px;
        margin-top: -48px;
        padding: 6px 6px 7px 7px;
        border-radius: 9px;
      }
      .card-ext {
        font-size: 15px;
      }
      .card-name {
        font-size: 9.5px;
      }
      #top-bar {
        opacity: 0.52;
        gap: 4px;
      }
      .pill-ctrl {
        font-size: 10.5px;
        padding: 3.5px 7.5px;
      }
      #hint-whisper {
        font-size: 10px;
        letter-spacing: 0.13em;
      }
    }
  </style>
</head>
<body class="font-v1 theme-opaline">
  <main id="stage">
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Seraphine · 栖薇的琉璃玫瑰圣堂档案夹</h1>

    <canvas id="scene"></canvas>

    <!-- 3D Perspective-Locked Folder Front Cover Typography & Gothic Rose Window Emblem -->
    <div id="folder-3d-anchor">
      <div id="cover-face-ui">
        <div class="cover-bottom-row">
          <div class="title-group">
            <div id="title-wrap">
              <!-- Variant 1: Bespoke Sweeping Spencerian Script "Seraphine" (homage to Image 3's dramatic S & tail!) -->
              <svg id="svg-calligraphy" width="228" height="58" viewBox="0 0 278 68" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Seraphine">

                  <linearGradient id="roseInkGrad" x1="4" y1="10" x2="270" y2="28" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#FFF5EA" stop-opacity="0.92" />
                    <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.99" />
                    <stop offset="100%" stop-color="#F7E4F5" stop-opacity="0.93" />
                  </linearGradient>
                </defs>
                <!-- Sweeping Spencerian Capital "S" with Image 3's signature wide left flourish! -->
                <path d="M6 42 C 1 28, 22 15, 48 16 C 63 16, 74 10, 68 8 C 61 6, 48 16, 49 28 C 50 40, 60 47, 45 55 C 31 62, 16 59, 20 50 C 24 42, 41 42, 58 46"
                      stroke="url(#roseInkGrad)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" />

                <!-- "a" oval -> graceful looped "p" -> tall cathedral "h" -->
                <path d="M120 37 C 115 33, 106 35, 104 42 C 102 48, 107 50, 113 48 C 118 46, 121 38, 121 35 C 120 42, 119 48, 124 49 C 129 50, 134 42, 136 35 C 134 45, 130 58, 127 63 C 125 66, 131 65, 134 56 C 136 47, 138 35, 145 35 C 150 35, 149 45, 144 48 C 149 48, 157 34, 163 17 C 167 7, 160 7, 156 19 C 152 32, 150 45, 152 49 C 154 46, 160 36, 166 36 C 170 36, 168 46, 172 49 C 176 51, 182 47, 187 40"
                      stroke="url(#roseInkGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <!-- "i" -> "n" -> "e" + long airy sanctuary flourish -->
                <path d="M187 37 C 185 43, 185 49, 190 49 C 195 49, 201 36, 206 36 C 210 36, 208 45, 207 49 C 210 48, 217 35, 222 36 C 227 37, 224 46, 229 49 C 234 51, 245 45, 248 38 C 250 34, 243 33, 239 38 C 235 44, 240 50, 251 49 C 261 48, 269 44, 275 41"
                      stroke="url(#roseInkGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Delicate Champagne-Gold Star & Rose Dewdrop Accents -->
                <path d="M190 25 L191.2 27.8 L194 29 L191.2 30.2 L190 33 L188.8 30.2 L186 29 L188.8 27.8 Z" fill="#FFE8C8" opacity="0.92" />
                <circle cx="37" cy="30" r="1.3" fill="#FFD9E8" opacity="0.82" />
                <circle cx="265" cy="51" r="1.2" fill="#FFE8C8" opacity="0.78" />
              </svg>
              <span id="text-calligraphy">Seraphine</span>
            </div>

            <div class="subtitle-box">
              <div id="subtitle-normal" class="subtitle-line">栖薇 · <span id="file-count">9</span> 阕圣咏残章</div>
              <div id="subtitle-drop" class="subtitle-line">松手，封入栖薇的圣堂</div>
            </div>
          </div>

          <!-- Image 3's Gothic Pointed-Arch Cathedral Window with Embedded Rose! -->
          <svg class="seal-icon" viewBox="0 0 34 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Outer & Inner Pointed Gothic Arch -->
            <path d="M4 44 V 21 C 4 11, 11 4.5, 17 2 C 23 4.5, 30 11, 30 21 V 44 H 4 Z"
                  stroke="rgba(246, 238, 245, 0.86)" stroke-width="1.2" />
            <path d="M6.5 42 V 21.5 C 6.5 13, 12 7.2, 17 4.8 C 22 7.2, 27.5 13, 27.5 21.5 V 42 H 6.5 Z"
                  stroke="rgba(246, 238, 245, 0.56)" stroke-width="0.85" />
            <!-- Upper Gothic Rose-Window Rosette & Trefoils -->
            <circle cx="17" cy="13.5" r="4.2" stroke="rgba(246, 238, 245, 0.78)" stroke-width="0.9" />
            <circle cx="17" cy="13.5" r="1.4" fill="rgba(255, 228, 200, 0.85)" />
            <circle cx="11.2" cy="19" r="2.3" stroke="rgba(246, 238, 245, 0.65)" stroke-width="0.8" />

            <path d="M17 35 C 14.2 34.2, 13.5 32.5, 15.2 32.2 C 16.3 32, 16.8 33.4, 17 35 Z" fill="rgba(246, 238, 245, 0.75)" />
            <path d="M17 34 C 19.8 33.2, 20.5 31.5, 18.8 31.2 C 17.7 31, 17.2 32.4, 17 34 Z" fill="rgba(246, 238, 245, 0.75)" />
            <path d="M13.5 26.2 C 13.2 23.6, 15 22.2, 17 22.2 C 19 22.2, 20.8 23.6, 20.5 26.2 C 20.2 28.4, 18.6 29.6, 17 29.6 C 15.4 29.6, 13.8 28.4, 13.5 26.2 Z"
                  stroke="rgba(255, 234, 206, 0.92)" stroke-width="1.0" fill="rgba(255, 214, 232, 0.25)" />
            <path d="M15.1 25.5 C 15.8 24.2, 18.2 24.2, 18.9 25.5 C 18.2 27.1, 15.8 27.1, 15.1 25.5 Z"
                  stroke="rgba(255, 238, 214, 0.88)" stroke-width="0.85" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Fanned Stained-Glass Scripture Cards -->
    <div id="card-fan-layer" aria-label="栖薇的圣咏残章"></div>

    <!-- Whisper-subtle Dual-Sanctuary Theme Switch + Calligraphy Picker + Audio -->
    <div id="top-bar">
      <button class="pill-ctrl active" data-theme="opaline" id="btn-theme-opaline" title="图3+图4：晨曦欧泊粉蓝琉璃">晨曦欧泊</button>
      <button class="pill-ctrl" data-theme="crimson" id="btn-theme-crimson" title="图2：午夜圣血酒红暗金雕花">午夜圣血</button>
      <span class="ctrl-sep" aria-hidden="true"></span>
      <button class="pill-ctrl active" data-font="1" id="btn-font-1" title="手写花体">花体</button>
      <button class="pill-ctrl" data-font="2" id="btn-font-2" title="古典草书">斜体</button>
      <button class="pill-ctrl" data-font="3" id="btn-font-3" title="衬线镌刻">衬线</button>

    // Romantic D-minor / F-major Cathedral Celesta Scale
    const CELESTA_HZ = [587.33, 659.25, 698.46, 880.00, 932.33, 1046.50, 1174.66, 1318.51, 1396.91, 1760.00];

    function ensureAudio() {
      if (!audioEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    let lastChimeAt = 0;
    function playCelesta(noteIndex = -1, gainPeak = 0.042, dur = 1.05) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      if (noteIndex === -1 && now - lastChimeAt < 0.08) return;
      lastChimeAt = now;

      const idx = noteIndex >= 0 ? noteIndex % CELESTA_HZ.length : Math.floor(Math.random() * CELESTA_HZ.length);
      const freq = CELESTA_HZ[idx] * (0.997 + Math.random() * 0.006);

      const osc = ctx.createOscillator();
      const overtone = ctx.createOscillator();
      const gain = ctx.createGain();
      const ovGain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      // Music-box bell chime 3rd harmonic burst that decays quickly
      overtone.type = 'sine';
      overtone.frequency.setValueAtTime(freq * 3.0, now);
      ovGain.gain.setValueAtTime(0.18, now);
      ovGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(gainPeak, now + 0.010);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      osc.connect(gain);
      overtone.connect(ovGain);
      ovGain.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      overtone.start(now);
      osc.stop(now + dur + 0.05);
      overtone.stop(now + dur + 0.05);
    }

      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(293.66, now); // D4

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.036, now + 0.45);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc1.start(now);
      osc2.start(now);
      vortexDrone = { osc1, osc2, gain };
