    // Image 2 Tribute: Intricate Baroque/Gothic Gold Filigree Inner Frame & Corner Spandrels (in Crimson Mode!)
    function drawGothicFiligreeFrame(g, tl, tr, br, bl, sf) {
      if (!currentTheme.filigree) return;
      const [gR, gG, gB] = currentTheme.goldStroke;

      function bilerp(u, v) {
        const topX = tl.x + (tr.x - tl.x) * u;
        const topY = tl.y + (tr.y - tl.y) * u;
        const botX = bl.x + (br.x - bl.x) * u;
        const botY = bl.y + (br.y - bl.y) * u;
        return {
          x: topX + (botX - topX) * v,
          y: topY + (botY - topY) * v
        };
      }

      const padU = 0.028;
      const padV = 0.042;
      const itl = bilerp(padU, padV);
      const itr = bilerp(1 - padU, padV);
      const ibr = bilerp(1 - padU, 1 - padV);
      const ibl = bilerp(padU, 1 - padV);

      g.save();
      drawRoundedQuadPath(g, itl, itr, ibr, ibl, 14 * sf);
      g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, 0.50)`;
      g.lineWidth = 1.05;
      g.stroke();

      // Gothic Corner Cusped Spandrel Arches (exact Image 2 architectural corner filigree!)
      const cornerDefs = [
        { u0: padU, v0: padV, du: 0.068, dv: 0.098 },
        { u0: 1 - padU, v0: padV, du: -0.068, dv: 0.098 },
        { u0: 1 - padU, v0: 1 - padV, du: -0.068, dv: -0.098 },
        { u0: padU, v0: 1 - padV, du: 0.068, dv: -0.098 }
      ];
      g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, 0.58)`;
      g.fillStyle = `rgba(${gR}, ${gG}, ${gB}, 0.18)`;
      g.lineWidth = 0.9;

      cornerDefs.forEach((cd) => {
        const pEdgeH = bilerp(cd.u0 + cd.du, cd.v0);
        const pEdgeV = bilerp(cd.u0, cd.v0 + cd.dv);
        const pCtrl = bilerp(cd.u0 + cd.du * 0.28, cd.v0 + cd.dv * 0.28);
        const pFleur = bilerp(cd.u0 + cd.du * 0.34, cd.v0 + cd.dv * 0.34);

        g.beginPath();
        g.moveTo(pEdgeH.x, pEdgeH.y);
        g.quadraticCurveTo(pCtrl.x, pCtrl.y, pEdgeV.x, pEdgeV.y);
        g.stroke();

        // Corner Quatrefoil Jewel inside spandrel
        const rQ = 3.4 * sf;
        g.beginPath();
        g.arc(pFleur.x, pFleur.y - rQ * 0.65, rQ * 0.55, 0, Math.PI * 2);
        g.arc(pFleur.x + rQ * 0.65, pFleur.y, rQ * 0.55, 0, Math.PI * 2);
        g.arc(pFleur.x, pFleur.y + rQ * 0.65, rQ * 0.55, 0, Math.PI * 2);
        g.arc(pFleur.x - rQ * 0.65, pFleur.y, rQ * 0.55, 0, Math.PI * 2);
        g.stroke();
      });

      // Side Diamond Finials + Bottom-Center Baroque Quatrefoil Clasp (matching Image 2!)
      const clasp = bilerp(0.5, 1 - padV);
      const rC = 5.6 * sf;
      g.beginPath();
      g.moveTo(clasp.x, clasp.y - rC);
      g.quadraticCurveTo(clasp.x + rC * 0.4, clasp.y - rC * 0.4, clasp.x + rC * 1.35, clasp.y);
      g.quadraticCurveTo(clasp.x + rC * 0.4, clasp.y + rC * 0.4, clasp.x, clasp.y + rC);
      g.quadraticCurveTo(clasp.x - rC * 0.4, clasp.y + rC * 0.4, clasp.x - rC * 1.35, clasp.y);
      g.quadraticCurveTo(clasp.x - rC * 0.4, clasp.y - rC * 0.4, clasp.x, clasp.y - rC);
      g.closePath();
      g.fill();
      g.stroke();

      [bilerp(padU, 0.48), bilerp(1 - padU, 0.48)].forEach((sfPt) => {
        const rd = 3.5 * sf;
        g.beginPath();
        g.moveTo(sfPt.x, sfPt.y - rd * 1.3);
        g.lineTo(sfPt.x + rd, sfPt.y);
        g.lineTo(sfPt.x, sfPt.y + rd * 1.3);
        g.lineTo(sfPt.x - rd, sfPt.y);
        g.closePath();
        g.fill();
        g.stroke();
      });
      g.restore();
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function drawPocketCardsInterior(g, crispPass = false) {
      const sf = folder.w / 392;
      if (!crispPass && !folder.isOpen && filesState.length > 0) {
        const count = Math.min(3, filesState.length);
        for (let i = 0; i < count; i++) {
          const ox = (i - 1) * 38 * sf;
          const oy = (-10 + Math.abs(i - 1) * 12) * sf;
          g.save();
          g.translate(folder.cx + ox, folder.cy + oy);
          g.rotate((i - 1) * 0.07);
          g.fillStyle = 'rgba(232, 212, 240, 0.12)';
          g.beginPath();
          g.roundRect(-24 * sf, -34 * sf, 48 * sf, 68 * sf, 7 * sf);
          g.fill();
          g.restore();
        }
      }

      if (pocketDropAnim) {
        const p = pocketDropAnim.t / pocketDropAnim.duration;
        let cyOffset = 0;
        let alpha = 1;
        if (p < 0.38) {
          const k = p / 0.38;
          cyOffset = (-75 + 88 * easeOutCubic(k)) * sf;
        } else if (p < 0.74) {
          const k = (p - 0.38) / 0.36;
          const arc = Math.sin(k * Math.PI);
          cyOffset = (13 - arc * 136) * sf;
        } else {
          const k = (p - 0.74) / 0.26;
          cyOffset = (13 + k * 24) * sf;
          alpha = 1 - k * 0.85;
        }

        const isPeekingAbove = cyOffset < -folder.h * 0.38;
        if ((crispPass && isPeekingAbove) || (!crispPass)) {
          const [gR, gG, gB] = currentTheme.goldStroke;
          g.save();
          g.translate(folder.cx, folder.cy + cyOffset);
          g.fillStyle = `rgba(238, 224, 246, ${(0.76 * alpha).toFixed(2)})`;
          g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, ${(0.92 * alpha).toFixed(2)})`;
          g.lineWidth = 1.2 * sf;
          g.beginPath();
          g.roundRect(-21 * sf, -30 * sf, 42 * sf, 60 * sf, 7 * sf);
          g.fill();
          g.stroke();

          g.fillStyle = `rgba(58, 36, 78, ${(0.88 * alpha).toFixed(2)})`;
          g.font = `italic ${Math.round(12 * sf)}px Georgia, serif`;
          g.fillText(pocketDropAnim.ext, -13 * sf, -8 * sf);
          g.restore();
        }
      }
    }

    function drawDraggableMiniStack(g) {
      const showOS = osDragging;
      if (!showOS && (folder.isOpen || dockPile.respawnAlpha <= 0.02)) return;

      const x = showOS ? pointer.x - 18 : dockPile.x;
      const y = showOS ? pointer.y + 16 : dockPile.y;
      const alpha = showOS ? 0.96 : dockPile.respawnAlpha * (dockPile.dragging ? 0.98 : 0.88);
      const sf = clamp(folder.w / 392, 0.78, 1.05);
      const extLabel = showOS ? osDragExt : dockPile.ext;
      const [gR, gG, gB] = currentTheme.goldStroke;

      g.save();
      g.translate(x, y);

      const aura = g.createRadialGradient(0, 0, 2, 0, 0, 38 * sf);
      aura.addColorStop(0, `rgba(${gR}, ${gG}, ${gB}, ${(0.34 * alpha).toFixed(2)})`);
      aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
      g.fillStyle = aura;
      g.beginPath();
      g.arc(0, 0, 38 * sf, 0, Math.PI * 2);
      g.fill();

      g.save();
      g.rotate(-0.14);
      g.fillStyle = `rgba(186, 162, 218, ${(0.44 * alpha).toFixed(2)})`;
      g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, ${(0.62 * alpha).toFixed(2)})`;
      g.lineWidth = 1;
      g.beginPath();
      g.roundRect(-17 * sf, -22 * sf, 32 * sf, 42 * sf, 5.5 * sf);
      g.fill();
      g.stroke();
      g.restore();

      g.save();
      g.translate(4 * sf, 2 * sf);
      g.rotate(0.08);
      g.fillStyle = `rgba(242, 232, 248, ${(0.86 * alpha).toFixed(2)})`;
      g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, ${(0.95 * alpha).toFixed(2)})`;
      g.lineWidth = 1.15;
      g.beginPath();
      g.roundRect(-16 * sf, -21 * sf, 32 * sf, 42 * sf, 5.5 * sf);
      g.fill();
      g.stroke();

      g.fillStyle = `rgba(62, 38, 82, ${(0.90 * alpha).toFixed(2)})`;
      g.font = `italic ${Math.round(10.5 * sf)}px Georgia, serif`;
      g.fillText(extLabel, -10 * sf, 12 * sf);
      g.restore();

      g.restore();
    }

    // =========================================================================
    // 12. MASTER RENDER LOOP (Cathedral Tyndall Rays + Frosted Glass + Roses)
    // =========================================================================
    function renderFrame(now) {
      stepSimulation(now);
      const tSec = now * 0.001;
      const sf = folder.w / 392;

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, vw, vh);

      // 0) Breathing Sanctuary Backlight & Subtle Diagonal Cathedral Tyndall Light Rays!
      const haloShiftX = Math.sin(tSec * 0.5) * 24;
      const haloShiftY = Math.cos(tSec * 0.38) * 18;
      const ambGrad = ctx.createRadialGradient(
        folder.cx + folder.w * 0.14 + haloShiftX,
        folder.cy - folder.h * 0.42 + haloShiftY,
        12,
        folder.cx + folder.w * 0.08,
        folder.cy - folder.h * 0.18,
        folder.w * 1.05
      );
      ambGrad.addColorStop(0.0, currentTheme.haloInner);
      ambGrad.addColorStop(0.48, currentTheme.haloMid);
      ambGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = ambGrad;
      ctx.fillRect(0, 0, vw, vh);

      // Ethereal Diagonal Cathedral Tyndall Shafts (gently breathing!)
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let ray = 0; ray < 3; ray++) {
        const rayBreath = 0.65 + 0.35 * Math.sin(tSec * 0.45 + ray * 1.7);
        ctx.save();
        ctx.translate(folder.cx + (ray - 0.6) * folder.w * 0.42, folder.cy - folder.h * 1.35);
        ctx.rotate(-0.42 + Math.sin(tSec * 0.25 + ray) * 0.025);
        const rw = (58 + ray * 24) * sf;
        const rh = folder.h * 2.9;
        const rGrad = ctx.createLinearGradient(0, 0, 0, rh);
        rGrad.addColorStop(0.0, 'rgba(0,0,0,0)');
        rGrad.addColorStop(0.32, ray % 2 === 0 ? currentTheme.tyndallA : currentTheme.tyndallB);
        rGrad.addColorStop(1.0, 'rgba(0,0,0,0)');
        ctx.globalAlpha = rayBreath;
        ctx.fillStyle = rGrad;
        ctx.fillRect(-rw * 0.5, 0, rw, rh);
        ctx.restore();
      }
      ctx.restore();

      // 1) Living, Swimming Cathedral Bokeh Light Orbs & Luminous Droplets
      const parallaxX = -folder.tiltY * 45;
      const parallaxY = folder.tiltX * 45;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ambientBokeh.forEach((b) => {
        const pulse = 0.62 + 0.38 * Math.sin(tSec * b.pulseSpeed + b.phase);
        const sp = bokehSprites[b.spriteIdx % bokehSprites.length];
        const drawR = b.radius * (0.9 + 0.16 * pulse);
        const bx = b.x + parallaxX * b.depth;
        const by = b.y + parallaxY * b.depth;
        ctx.globalAlpha = b.baseAlpha * pulse;
        ctx.drawImage(sp.soft, bx - drawR, by - drawR, drawR * 2, drawR * 2);
        if (b.isDroplet) {
          const [r, gr, bl] = sp.rgb;
          ctx.globalAlpha = b.baseAlpha * pulse * 0.72;
          ctx.fillStyle = `rgba(${Math.min(255, r + 35)}, ${Math.min(255, gr + 25)}, ${Math.min(255, bl + 30)}, 0.9)`;
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(1.5, drawR * 0.24), 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // 2) Floating Gold & Rose Cathedral Stardust
      stardust.forEach((s) => {
        const tw = 0.38 + 0.62 * (0.5 + 0.5 * Math.sin(tSec * s.twinkleSpeed + s.phase));
        const [r, g, b] = currentTheme.bokehColors[s.colorIdx % 4];
        const sx = s.x + parallaxX * (s.depth * 0.65);
        const sy = s.y + parallaxY * (s.depth * 0.65);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${(s.alpha * tw).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      drawParticlesByDepth(ctx, 2);

      // 3) Folder Upright Backplate (with Image 3's warm champagne-gold top-tab gleam!)
      const bLeft = folder.cx - folder.w * 0.488 + folder.tiltY * 14;
      const bTop = folder.cy - folder.h * 0.50 - folder.tiltX * 12;
      const bW = folder.w * 0.976;
      const bH = folder.h * 0.99;
      const tabH = 22 * sf;
      const tabW = 104 * sf;
      const rBack = 16 * sf;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(bLeft + rBack, bTop - tabH);
      ctx.lineTo(bLeft + tabW - 14 * sf, bTop - tabH);
      ctx.quadraticCurveTo(bLeft + tabW - 2 * sf, bTop - tabH, bLeft + tabW + 10 * sf, bTop);
      ctx.lineTo(bLeft + bW - rBack, bTop);
      ctx.quadraticCurveTo(bLeft + bW, bTop, bLeft + bW, bTop + rBack);
      ctx.lineTo(bLeft + bW, bTop + bH - rBack);
      ctx.quadraticCurveTo(bLeft + bW, bTop + bH, bLeft + bW - rBack, bTop + bH);
      ctx.lineTo(bLeft + rBack, bTop + bH);
      ctx.quadraticCurveTo(bLeft, bTop + bH, bLeft, bTop + bH - rBack);
      ctx.lineTo(bLeft, bTop - tabH + rBack);
      ctx.quadraticCurveTo(bLeft, bTop - tabH, bLeft + rBack, bTop - tabH);
      ctx.closePath();

      const backGrad = ctx.createLinearGradient(bLeft, bTop - tabH, bLeft, bTop + bH);
      backGrad.addColorStop(0, currentTheme.backTop);
      backGrad.addColorStop(0.38, currentTheme.backMid);
      backGrad.addColorStop(1, currentTheme.backBot);
      ctx.fillStyle = backGrad;
      ctx.fill();

      // Warm Champagne-Gold Specular Highlight on Folder Tab!
      const [rbR, rbG, rbB] = currentTheme.rimBright;
      const tabRim = ctx.createLinearGradient(bLeft, bTop - tabH, bLeft + tabW * 1.4, bTop + 20);
      tabRim.addColorStop(0, `rgba(${rbR}, ${rbG}, ${rbB}, 0.72)`);
      tabRim.addColorStop(0.45, `rgba(${rbR}, ${rbG}, ${rbB}, 0.28)`);
      tabRim.addColorStop(1, `rgba(${rbR}, ${rbG}, ${rbB}, 0.08)`);
      ctx.strokeStyle = tabRim;
      ctx.lineWidth = 1.25;
      ctx.stroke();
      ctx.restore();

      // 4) Render Pocket Contents onto Offscreen `pocketCanvas`
      pocketCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      pocketCtx.clearRect(0, 0, vw, vh);

      drawPocketCardsInterior(pocketCtx, false);

      // Draw Stems, Crown Bramble Foliage, Deep Pocket Roses, then Crisp Upper Crown Roses!
      roses.forEach((r) => {
        if (r.layer === 'pocket' && r.deepInside) drawThornyStemForRose(pocketCtx, r, tSec);
      });
      roses.forEach((r) => {
        if (r.layer === 'pocket' && r.deepInside) drawOneRoseHead(pocketCtx, r, tSec);
      });

      drawCrownBramble(pocketCtx, tSec, false);
      roses.forEach((r) => {
        if (r.layer === 'pocket' && !r.deepInside) drawThornyStemForRose(pocketCtx, r, tSec);
      });
      // Draw Left Crown Rose & Buds first, then Golden Lip-Arch Twig, then Grand Hero Rose on top!
      roses.forEach((r, idx) => {
        if (r.layer === 'pocket' && !r.deepInside && idx !== 0) drawOneRoseHead(pocketCtx, r, tSec);
      });
      drawCrownBramble(pocketCtx, tSec, true);
      roses.forEach((r, idx) => {
        if (r.layer === 'pocket' && !r.deepInside && idx === 0) drawOneRoseHead(pocketCtx, r, tSec);
      });

      // Draw crisp upper crown roses onto main canvas BEFORE front glass cover clips them!
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(pocketCanvas, 0, 0);
      ctx.restore();

      // 5) Velvety Progressive Depth Frosted Glass Blur!
      if (supportsCtxFilter) {
        blurNearCtx.clearRect(0, 0, blurNear.width, blurNear.height);
        blurNearCtx.filter = 'blur(6px)';
        blurNearCtx.drawImage(pocketCanvas, 0, 0, blurNear.width, blurNear.height);
        blurNearCtx.filter = 'none';

        blurDeepCtx.clearRect(0, 0, blurDeep.width, blurDeep.height);
        blurDeepCtx.filter = 'blur(13px)';
        blurDeepCtx.drawImage(blurNear, 0, 0, blurDeep.width, blurDeep.height);
        blurDeepCtx.filter = 'none';
      } else {
        smoothKawasePass(pocketCanvas, blurNear, blurNearCtx, 2);
        smoothKawasePass(blurNear, blurDeep, blurDeepCtx, 3);
      }

      const hw = folder.w * 0.5;
      const hh = folder.h * 0.5;
      const tl = projectCoverPoint(-hw, -hh, 0);
      const tr = projectCoverPoint(hw, -hh, 0);
      const br = projectCoverPoint(hw, hh, 0);
      const bl = projectCoverPoint(-hw, hh, 0);

      const topY = Math.min(tl.y, tr.y);
      const botY = Math.max(bl.y, br.y);

      ctx.save();
      drawRoundedQuadPath(ctx, tl, tr, br, bl, 18 * sf);
      ctx.clip();

      ctx.fillStyle = currentTheme.glassBase;
      ctx.fillRect(0, 0, vw, vh);

      ctx.globalAlpha = 0.98;
      ctx.drawImage(blurDeep, 0, 0, vw, vh);
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.62;
      ctx.drawImage(blurDeep, 0, 0, vw, vh);
      ctx.globalCompositeOperation = 'source-over';

      compBlurCtx.clearRect(0, 0, compBlur.width, compBlur.height);
      compBlurCtx.globalCompositeOperation = 'source-over';
      compBlurCtx.drawImage(blurNear, 0, 0, compBlur.width, compBlur.height);
      compBlurCtx.globalCompositeOperation = 'destination-in';
      const maskTop = (topY / vh) * compBlur.height;
      const maskMid = ((topY + (botY - topY) * 0.52) / vh) * compBlur.height;
      const vMask = compBlurCtx.createLinearGradient(0, maskTop, 0, Math.max(maskTop + 8, maskMid));
      vMask.addColorStop(0.0, 'rgba(255, 255, 255, 0.80)');
      vMask.addColorStop(0.45, 'rgba(255, 255, 255, 0.32)');
      vMask.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      compBlurCtx.fillStyle = vMask;
      compBlurCtx.fillRect(0, 0, compBlur.width, compBlur.height);

      ctx.globalAlpha = 0.80;
      ctx.drawImage(compBlur, 0, 0, vw, vh);
      ctx.globalAlpha = 1.0;

      // Smoky-Amethyst & Opaline / Velvet-Plum Frosted Tint
      const frostGrad = ctx.createLinearGradient(tl.x, topY, bl.x, botY);
      frostGrad.addColorStop(0.0, currentTheme.frostTop);
      frostGrad.addColorStop(0.32, currentTheme.frostMid);
      frostGrad.addColorStop(1.0, currentTheme.frostBot);
      ctx.fillStyle = frostGrad;
      ctx.fillRect(0, 0, vw, vh);

      // Warm Candlelight Pointer Refraction on Frosted Glass
      const [spR, spG, spB] = currentTheme.spotGlow;
      const spotR = folder.w * 0.72;
      const spot = ctx.createRadialGradient(pointer.smoothX, pointer.smoothY, 4, pointer.smoothX, pointer.smoothY, spotR);
      const spotBoost = folder.isDragNear ? 0.24 : (0.11 + pointer.vortexPower * 0.16);
      spot.addColorStop(0.0, `rgba(${spR}, ${spG}, ${spB}, ${spotBoost.toFixed(3)})`);
      spot.addColorStop(0.48, `rgba(196, 158, 226, ${(spotBoost * 0.42).toFixed(3)})`);
      spot.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = spot;
      ctx.fillRect(0, 0, vw, vh);

      if (grainPattern) {
        ctx.globalAlpha = 0.30;
        ctx.fillStyle = grainPattern;
        ctx.fillRect(0, 0, vw, vh);
        ctx.globalAlpha = 1.0;
      }
      ctx.restore();

      // 6) Image 2 Gothic Gold Filigree Inner Frame (when in Crimson Nocturne mode!)
      drawGothicFiligreeFrame(ctx, tl, tr, br, bl, sf);

      // 7) Image 3 Signature Warm Champagne-Gold Specular Bevel Rim!
      ctx.save();
      drawRoundedQuadPath(ctx, tl, tr, br, bl, 18 * sf);
      const [rsR, rsG, rsB] = currentTheme.rimSoft;
      const dragGlow = folder.isDragNear ? 0.24 : 0;
      const rimGrad = ctx.createLinearGradient(tl.x, tl.y, br.x, br.y);
      rimGrad.addColorStop(0.0, `rgba(255, 246, 226, ${Math.min(1, 0.88 + dragGlow).toFixed(2)})`); // Bright champagne-gold shoulder!
      rimGrad.addColorStop(0.22, `rgba(${rbR}, ${rbG}, ${rbB}, ${(0.56 + dragGlow).toFixed(2)})`);
      rimGrad.addColorStop(0.55, `rgba(${rsR}, ${rsG}, ${rsB}, ${(0.28 + dragGlow).toFixed(2)})`);
      rimGrad.addColorStop(0.84, `rgba(${rbR}, ${rbG}, ${rbB}, ${(0.48 + dragGlow).toFixed(2)})`);
      rimGrad.addColorStop(1.0, `rgba(255, 244, 220, ${Math.min(1, 0.82 + dragGlow).toFixed(2)})`);
      ctx.strokeStyle = rimGrad;
      ctx.lineWidth = 1.45;
      ctx.stroke();

      // Extra soft candlelit bloom at top-left shoulder & bottom-right corner (Image 3 magic!)
      ctx.globalCompositeOperation = 'screen';
      const cornerSpots = [
        { x: tl.x + 26 * sf, y: tl.y + 4 * sf, r: 54 * sf, a: 0.28 },
        { x: bl.x + 24 * sf, y: bl.y - 2 * sf, r: 46 * sf, a: 0.22 },
        { x: br.x - 18 * sf, y: br.y - 4 * sf, r: 48 * sf, a: 0.24 }
      ];
      cornerSpots.forEach((cs) => {
        const cg = ctx.createRadialGradient(cs.x, cs.y, 1, cs.x, cs.y, cs.r);
        cg.addColorStop(0, `rgba(255, 236, 204, ${cs.a})`);
        cg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(cs.x, cs.y, cs.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      drawPocketCardsInterior(ctx, true);

      // 8) Foreground Cascading Right-Edge Thorny Vine + Overhanging Roses & Hanging Bud!
      drawRightCascadingVine(ctx, tSec);
      roses.forEach((r) => {
        if (r.layer === 'front') drawThornyStemForRose(ctx, r, tSec);
      });
      roses.forEach((r) => {
        if (r.layer === 'front') drawOneRoseHead(ctx, r, tSec);
      });

      drawParticlesByDepth(ctx, 1);
      drawParticlesByDepth(ctx, 0);

      drawDraggableMiniStack(ctx);

      if (pointer.vortexPower > 0.02) {
        ctx.save();
        const vp = pointer.vortexPower;
        const [gR, gG, gB] = currentTheme.goldStroke;
        for (let r = 0; r < 3; r++) {
          const rad = (24 + r * 26) * (0.75 + 0.25 * Math.sin(tSec * 6 + r));
          ctx.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, ${(0.32 * vp * (1 - r * 0.28)).toFixed(3)})`;
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, rad, tSec * (4 + r), tSec * (4 + r) + Math.PI * 1.35);
          ctx.stroke();
        }
        ctx.restore();
      }

      if (pointer.cursorAlpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = pointer.cursorAlpha;
        const cx = pointer.smoothX;
        const cy = pointer.smoothY;
        const rs = pointer.ringScale;
        const [gR, gG, gB] = currentTheme.goldStroke;

        const cGlow = ctx.createRadialGradient(cx, cy, 1, cx, cy, 36);
        cGlow.addColorStop(0, `rgba(${gR}, ${gG}, ${gB}, 0.24)`);
        cGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = cGlow;
        ctx.beginPath();
        ctx.arc(cx, cy, 36, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = pointer.vortexActive ? `rgba(${gR}, ${gG}, ${gB}, 0.90)` : 'rgba(255, 244, 232, 0.56)';
        ctx.lineWidth = 1.05;
        ctx.beginPath();
        ctx.arc(cx, cy, 10.5 * rs, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#FFF8EE';
        ctx.beginPath();
        ctx.arc(cx, cy, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(renderFrame);
    }

    function drawParticlesByDepth(g, targetLayer) {
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.depthLayer !== targetLayer) continue;

        const lifeRatio = p.age / p.life;
        const fade = lifeRatio < 0.12 ? (lifeRatio / 0.12) : Math.pow(1 - lifeRatio, 1.35);
        if (fade <= 0.01) continue;

        const sp = bokehSprites[p.spriteIdx % bokehSprites.length];
        g.save();
        g.globalAlpha = fade;
        g.translate(p.x, p.y);

        if (p.isGoldSpark) {
          // 4-point Champagne-Gold Cathedral Star Sparkle!
          const r = p.size * 1.45;
          g.rotate(p.rot * 0.5);
          g.fillStyle = 'rgba(255, 240, 202, 0.95)';
          g.beginPath();
          g.moveTo(0, -r);
          g.quadraticCurveTo(r * 0.18, -r * 0.18, r, 0);
          g.quadraticCurveTo(r * 0.18, r * 0.18, 0, r);
          g.quadraticCurveTo(-r * 0.18, r * 0.18, -r, 0);
          g.quadraticCurveTo(-r * 0.18, -r * 0.18, 0, -r);
          g.closePath();
          g.fill();
        } else if (targetLayer === 0) {
          const d = p.size * 2.2;
          g.drawImage(sp.soft, -d * 0.5, -d * 0.5, d, d);
        } else if (targetLayer === 1) {
          // 3D-fluttering Stained-Glass Rose Petal!
          g.rotate(p.rot);
          const flipScale = 0.42 + 0.58 * Math.abs(Math.cos(p.flutterPhase));
          g.scale(flipScale, 1);
          const d = p.size * 2.4;
          g.drawImage(sp.petal, -d * 0.5, -d * 0.5, d, d);
        } else {
          const [r, gr, b] = sp.rgb;
          g.fillStyle = `rgb(${r}, ${gr}, ${b})`;
          g.beginPath();
          g.arc(0, 0, p.size, 0, Math.PI * 2);
          g.fill();
        }
        g.restore();
      }
    }

    updateLayout();
    initBackgroundLights();
    initCollection();
    window.addEventListener('resize', updateLayout);
    requestAnimationFrame(renderFrame);
  })();
  </script>
</body>
</html>
