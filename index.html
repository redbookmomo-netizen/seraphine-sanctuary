          phase: Math.random() * Math.PI * 2,
          pulseSpeed: 0.8 + Math.random() * 1.3,
          radius: isDroplet
            ? (6.0 + Math.random() * 8.5) * (0.8 + depth * 0.3)
            : (20 + Math.random() * 32) * (0.75 + depth * 0.38),
          baseAlpha: isDroplet
            ? (0.40 + Math.random() * 0.36)
            : (0.26 + Math.random() * 0.32),
          isDroplet,
          spriteIdx: i % 4,
          depth,
          pushX: 0,
          pushY: 0
        });
      }
    }

    // =========================================================================
    // 6. BOTANICAL & VITRAIL ROSE ARCHITECTURE (Image 4 Composition + Image 3 Thorns)
    // =========================================================================
    // 9 Primary Slots matching Image 4's exact silhouette:
    // - Grand Hero Center-Right Rose + High Slender Rosebud + Left-Center Crown Rose
    // - Right-Corner Cascading Rose + Drooping Pendant Rosebud on Trailing Vine
    // - 4 Sub-surface Pocket Roses & Buds creating Image 4's rich blurred interior!
    const ROSE_SLOTS = [
      // 0: Grand Hero Rose (Top Center-Right — magnificent wide 3/4 vitrail bloom nestled above lip!)
      { nx: 0.14,  ny: -0.63, scale: 1.56, angle: 0.11,  kind: 'full', layer: 'pocket', varIdx: 0, rootX: -0.02, rootY: 0.34, leaves: [-1, 1] },
      // 1: Right-Corner Cascading Full Rose (spilling lushly over top-right corner of glass!)
      { nx: 0.41,  ny: -0.37, scale: 1.24, angle: 0.34,  kind: 'full', layer: 'front',  varIdx: 0, rootX: 0.18,  rootY: -0.52, leaves: [1, -1] },
      // 2: Left-Center Crown Rose (nestled directly into top frosted pocket lip!)
      { nx: -0.14, ny: -0.53, scale: 1.18, angle: -0.12, kind: 'full', layer: 'pocket', varIdx: 1, rootX: -0.18, rootY: 0.32, leaves: [-1] },
      // 3: High Slender Pointed Rosebud (rising gracefully from behind Hero Rose's right shoulder!)
      { nx: 0.33,  ny: -0.94, scale: 0.94, angle: 0.28,  kind: 'bud',  layer: 'pocket', varIdx: 0, rootX: 0.17,  rootY: -0.60, leaves: [1] },
      // 4: Iconic Drooping Pendant Rosebud on Right Vine (hanging down right wall!)
      { nx: 0.52,  ny: 0.16,  scale: 0.98, angle: 2.92,  kind: 'bud',  layer: 'front',  varIdx: 2, isVineTip: true, leaves: [] },
      // 5: Pocket-Lip Left Peeking Bud (tucked right beside folder tab!)
      { nx: -0.27, ny: -0.48, scale: 0.86, angle: -0.28, kind: 'bud',  layer: 'pocket', varIdx: 2, rootX: -0.24, rootY: 0.18, leaves: [-1] },
      // 6: Sub-surface Frosted Pocket Rose (Upper-Left dreamy blurred glow inside glass!)
      { nx: -0.16, ny: -0.24, scale: 1.12, angle: -0.18, kind: 'semi', layer: 'pocket', varIdx: 0, rootX: -0.14, rootY: 0.44, leaves: [-1, 1], deepInside: true },
      // 7: Sub-surface Frosted Pocket Rose (Center-Right dreamy blurred glow inside glass!)
      { nx: 0.22,  ny: -0.12, scale: 1.16, angle: 0.20,  kind: 'semi', layer: 'pocket', varIdx: 1, rootX: 0.06,  rootY: 0.46, leaves: [1, -1], deepInside: true },
      // 8: Sub-surface Deep Pocket Rose (Center-Lower warm blurred glow!)
      { nx: 0.01,  ny: 0.08,  scale: 0.98, angle: 0.08,  kind: 'semi', layer: 'pocket', varIdx: 2, rootX: 0.02,  rootY: 0.48, leaves: [-1], deepInside: true }
    ];

    function createRose(fileId, slotIdx, spawnFresh = false) {
      let tpl;
      if (slotIdx < ROSE_SLOTS.length) {
        tpl = ROSE_SLOTS[slotIdx];
      } else {
        // Extra roses dragged in sprout along the upper crown & right cascade!
        const extraPositions = [
          { nx: -0.01, ny: -0.76, scale: 1.08, angle: 0.04,  kind: 'semi', layer: 'pocket', varIdx: slotIdx % 3, rootX: -0.04, rootY: 0.25, leaves: [-1, 1] },
          { nx: 0.49,  ny: -0.11, scale: 0.98, angle: 0.72,  kind: 'semi', layer: 'front',  varIdx: slotIdx % 3, rootX: 0.40,  rootY: -0.38, leaves: [1] },
          { nx: 0.27,  ny: -0.54, scale: 1.06, angle: 0.24,  kind: 'full', layer: 'pocket', varIdx: slotIdx % 3, rootX: 0.12,  rootY: 0.28, leaves: [1] },
          { nx: -0.24, ny: -0.66, scale: 0.92, angle: -0.22, kind: 'bud',  layer: 'pocket', varIdx: slotIdx % 3, rootX: -0.20, rootY: 0.22, leaves: [-1] }
        ];
        tpl = extraPositions[(slotIdx - ROSE_SLOTS.length) % extraPositions.length];
      }

      return {
        id: fileId,
        nx: tpl.nx,
        ny: tpl.ny,
        rootX: tpl.rootX ?? (tpl.nx * 0.5),
        rootY: tpl.rootY ?? 0.35,
        scale: tpl.scale,
        baseAngle: tpl.angle,
        angleOffset: 0,
        angleVel: 0,
        dispX: 0,
        dispY: spawnFresh ? 68 : 0,
        velX: 0,
        velY: 0,
        grow: spawnFresh ? 0.04 : 1.0,
        kind: tpl.kind, // 'full' | 'semi' | 'bud'
        layer: tpl.layer,
        varIdx: tpl.varIdx,
        isVineTip: Boolean(tpl.isVineTip),
        deepInside: Boolean(tpl.deepInside),
        leaves: tpl.leaves || [],
        phase: Math.random() * Math.PI * 2,
        breatheSpeed: 1.15 + (slotIdx % 4) * 0.18
      };
    }

    function initCollection() {
      filesState = [];
      roses = [];
      INITIAL_FILES.forEach((f, idx) => {
        const fid = idSeed++;
        filesState.push({ id: fid, ext: f.ext, name: f.name });
        roses.push(createRose(fid, idx, false));
      });
      rebuildCardDOM();
      updateFileCounter();
    }

    function updateFileCounter() {
      fileCountEl.textContent = String(filesState.length);
    }

    // =========================================================================
    // 7. FANNED RELIQUARY SCRIPTURE CARDS DOM
    // =========================================================================
    let activeCardId = null;

    function rebuildCardDOM() {
      cardFanEl.innerHTML = '';
      filesState.forEach((file) => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.dataset.id = String(file.id);
        card.innerHTML = `
          <div class="card-top">
            <svg class="card-mini-mark" viewBox="0 0 14 20" fill="none">
              <path d="M2 18V9C2 4.8 4.5 2 7 1C9.5 2 12 4.8 12 9V18H2Z" stroke="rgba(255,238,214,0.82)" stroke-width="1.1"/>
              <circle cx="7" cy="7.2" r="2.1" stroke="rgba(255,238,214,0.78)" stroke-width="0.9"/>
              <line x1="7" y1="10.5" x2="7" y2="17.5" stroke="rgba(255,238,214,0.65)" stroke-width="0.85"/>
            </svg>
            <button class="card-del-btn" type="button" aria-label="焚去 ${file.name}">删掉</button>
          </div>
          <div class="card-ext">${file.ext}</div>
          <div class="card-name">${file.name}</div>
          <svg class="card-watermark" viewBox="0 0 28 40" fill="none">
            <path d="M4 37V17C4 9 9.5 3.5 14 1.5C18.5 3.5 24 9 24 17V37H4Z" stroke="#FFF0DC" stroke-width="1.3"/>
            <circle cx="14" cy="12" r="4" stroke="#FFF0DC" stroke-width="1.1"/>
            <circle cx="14" cy="24" r="3.2" fill="#FFF0DC"/>
            <line x1="14" y1="27" x2="14" y2="36" stroke="#FFF0DC" stroke-width="1.2"/>
          </svg>
        `;

        const delBtn = card.querySelector('.card-del-btn');
        delBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteFileById(file.id, card);
        });

        card.addEventListener('pointerenter', (e) => {
          if (e.pointerType === 'mouse' && folder.isOpen) {
            activeCardId = file.id;
            layoutCards();
            playCelesta(-1, 0.022, 0.65);
          }
        });
        card.addEventListener('pointerleave', (e) => {
          if (e.pointerType === 'mouse' && activeCardId === file.id) {
            activeCardId = null;
            layoutCards();
          }
        });
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!folder.isOpen) return;
          if (activeCardId === file.id) {
            activeCardId = null;
          } else {
            activeCardId = file.id;
            playCelesta(-1, 0.030, 0.75);
          }
          layoutCards();
        });

        cardFanEl.appendChild(card);
      });
      layoutCards();
    }

    function layoutCards() {
      const cards = cardFanEl.querySelectorAll('.card-item');
      const n = cards.length;
      if (!n) return;

      const isMobile = vw < 560;
      const maxSpanDeg = Math.min(isMobile ? 50 : 60, Math.max(16, (n - 1) * (isMobile ? 5.6 : 6.6)));
      const maxHalfX = isMobile ? Math.min(vw * 0.39, 150) : Math.min(folder.w * 0.72, vw * 0.38);

      cards.forEach((card, i) => {
        if (card.classList.contains('deleting')) return;
        const fid = Number(card.dataset.id);
        const t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
        const deg = t * (maxSpanDeg * 0.5);
        const rad = deg * Math.PI / 180;
        const x = Math.sin(rad * 1.12) * (maxHalfX / Math.sin(Math.max(0.26, (maxSpanDeg * 0.5 * Math.PI / 180) * 1.12)));
        const baseLiftY = isMobile ? -34 : -44;
        const archY = baseLiftY + (1 - Math.cos(rad * 1.45)) * (isMobile ? 60 : 88);

        const isActive = (fid === activeCardId);
        card.classList.toggle('active', isActive);
        card.style.zIndex = String(10 + i);

        if (folder.isOpen) {
          const lift = isActive ? (isMobile ? -26 : -34) : 0;
          const sc = isActive ? 1.08 : 1.0;
          const lx = x + Math.sin(rad) * (-lift);
          const ly = archY - Math.cos(rad) * (-lift);
          card.style.transitionDelay = isActive ? '0ms' : `${i * 20}ms`;
          card.style.transform = `translate3d(${lx.toFixed(1)}px, ${ly.toFixed(1)}px, 0) rotate(${deg.toFixed(2)}deg) scale(${sc})`;
        } else {
          card.style.transitionDelay = '0ms';
          card.style.transform = `translate3d(${(t * 18).toFixed(1)}px, -18px, 0) rotate(${(deg * 0.25).toFixed(2)}deg) scale(0.72)`;
        }
      });
    }

    function setFolderOpen(open) {
      folder.isOpen = open;
      activeCardId = null;
      cardFanEl.classList.toggle('open', open);
      playCelesta(open ? 5 : 2, 0.036, 0.95);
      layoutCards();
    }

    function deleteFileById(fid, cardEl) {
      const idx = filesState.findIndex(f => f.id === fid);
      if (idx === -1) return;
      filesState.splice(idx, 1);
      if (activeCardId === fid) activeCardId = null;
      updateFileCounter();
      playPetalScatterSound();

      if (cardEl) {
        cardEl.classList.add('deleting');
        setTimeout(() => {
          if (cardEl.parentNode) cardEl.parentNode.removeChild(cardEl);
          layoutCards();
        }, 300);
      }

      const rIdx = roses.findIndex(r => r.id === fid);
      if (rIdx !== -1) {
        const r = roses[rIdx];
        spawnRosePetalDissolve(r);
        roses.splice(rIdx, 1);
      }
      setTimeout(layoutCards, 20);
    }

    function addNewFile(extRaw, nameRaw) {
      const cleanExt = (extRaw || 'png').replace(/^\./, '').toLowerCase().slice(0, 5) || 'png';
      const cleanName = (nameRaw || '圣咏残章').replace(/\.[^.]+$/, '').slice(0, 9) || '圣咏残章';
      const fid = idSeed++;
      const slotIdx = roses.length;

      pocketDropAnim = {
        ext: cleanExt,
        t: 0,
        duration: 1.05
      };

      playBloomDropSound();

      filesState.push({ id: fid, ext: cleanExt, name: cleanName });
      const newRose = createRose(fid, slotIdx, true);
      roses.push(newRose);

      const bx = folder.cx + newRose.nx * folder.w * 0.85;
      const by = folder.cy + newRose.ny * folder.h * 0.75;
      for (let i = 0; i < 22; i++) {
        spawnParticle(bx + (Math.random() - 0.5) * 48, by + (Math.random() - 0.5) * 26, i % 3 === 0 ? 'goldspark' : 'ambient');
      }

      updateFileCounter();
      rebuildCardDOM();
    }

    // =========================================================================
    // 8. PARTICLE SYSTEM (3D-Fluttering Stained-Glass Petals, Gold Sparks & Bokeh)
    // =========================================================================
    function spawnParticle(x, y, mode = 'ambient', customPal = null) {
      if (particles.length > 460) particles.shift();
      const spriteIdx = customPal !== null ? customPal : Math.floor(Math.random() * bokehSprites.length);
      const depthRoll = Math.random();
      const depthLayer = depthRoll < 0.20 ? 0 : (depthRoll < 0.76 ? 1 : 2);

      let vx = (Math.random() - 0.45) * 34;
      let vy = 16 + Math.random() * 34;
      let life = 2.8 + Math.random() * 2.6;
      let size = depthLayer === 0 ? (15 + Math.random() * 19) : (depthLayer === 1 ? (6.2 + Math.random() * 5.8) : (1.5 + Math.random() * 2.0));

      if (mode === 'ambient') {
        vx = 8 + Math.random() * 26;
        vy = 18 + Math.random() * 32;
        size *= 0.88;
      } else if (mode === 'dissolve') {
        vx = (Math.random() - 0.4) * 72;
        vy = -24 + Math.random() * 78;
        life = 2.5 + Math.random() * 2.0;
      } else if (mode === 'goldspark') {
        vx = (Math.random() - 0.5) * 42;
        vy = -32 - Math.random() * 48;
        size = 1.6 + Math.random() * 2.8;
        life = 1.5 + Math.random() * 1.3;
      } else if (mode === 'vortex') {
        const ang = Math.random() * Math.PI * 2;
        const rad = 18 + Math.random() * 160;
        x = pointer.x + Math.cos(ang) * rad;
        y = pointer.y + Math.sin(ang) * rad;
        vx = -Math.sin(ang) * 95;
        vy = Math.cos(ang) * 95;
        life = 3.2 + Math.random() * 2.2;
      }

      particles.push({
        x, y, vx, vy,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 3.8,
        flutterPhase: Math.random() * Math.PI * 2,
        flutterSpeed: 2.4 + Math.random() * 3.2,
        size,
        depthLayer,
        spriteIdx,
        isGoldSpark: mode === 'goldspark',
        age: 0,
        life
      });
    }

    function getRoseWorldPos(r) {
      if (r.isVineTip && rightVine.initialized) {
        const tip = rightVine.nodes[rightVine.nodes.length - 1];
        return { x: tip.x, y: tip.y };
      }
      return {
        x: folder.cx + r.nx * folder.w + r.dispX,
        y: folder.cy + r.ny * folder.h + r.dispY
      };
    }

    function spawnRosePetalDissolve(r) {
      const pos = getRoseWorldPos(r);
      for (let i = 0; i < 52; i++) {
        const ox = (Math.random() - 0.5) * 58;
        const oy = (Math.random() - 0.5) * 58;
        spawnParticle(pos.x + ox, pos.y + oy, i % 4 === 0 ? 'goldspark' : 'dissolve');
      }
    }

    function triggerVortexBurst() {
      const cx = pointer.x;
      const cy = pointer.y;
      for (let i = 0; i < 195; i++) {
        spawnParticle(cx + (Math.random() - 0.5) * 36, cy + (Math.random() - 0.5) * 36, 'vortex');
      }
      particles.forEach((p) => {
        const dx = p.x - cx;
        const dy = p.y - cy;
        const dist = Math.hypot(dx, dy) + 0.001;
        const dirX = dx / dist;
        const dirY = dy / dist;
        const speed = 160 + Math.random() * 490;
        const tang = (Math.random() - 0.5) * 150;
        p.vx = dirX * speed - dirY * tang;
        p.vy = dirY * speed + dirX * tang;
        p.age = 0;
        p.life = 3.0 + Math.random() * 2.8;
      });
      roses.forEach((r) => {
        const pos = getRoseWorldPos(r);
        const dx = pos.x - cx;
        const dy = pos.y - cy;
        const d = Math.hypot(dx, dy) + 35;
        r.velX += (dx / d) * 145;
        r.velY += (dy / d) * 115;
        r.angleVel += clamp((dx / d) * 1.4, -1.6, 1.6);
      });
      rightVine.nodes.forEach((nd, k) => {
        if (k === 0) return;
        const dx = nd.x - cx;
        const dy = nd.y - cy;
        const d = Math.hypot(dx, dy) + 35;
        nd.vx += (dx / d) * 165 * (k / rightVine.nodes.length);
        nd.vy += (dy / d) * 125 * (k / rightVine.nodes.length);
      });
      ambientBokeh.forEach((b) => {
        const dx = b.x - cx;
        const dy = b.y - cy;
        const d = Math.hypot(dx, dy) + 40;
        b.pushX += (dx / d) * 190;
        b.pushY += (dy / d) * 190;
      });
    }

    // =========================================================================
    // 9. UNIFIED POINTER, TOUCH/DRAG & VORTEX INTERACTION
    // =========================================================================
    const pointer = {
      x: vw * 0.62,
      y: vh * 0.48,
      smoothX: vw * 0.62,
      smoothY: vh * 0.48,
      vx: 0,
      vy: 0,
      active: false,
      isTouch: false,
      cursorAlpha: 0,
      isDown: false,
      downX: 0,
      downY: 0,
      downAt: 0,
      movedDist: 0,
      vortexActive: false,
      vortexPower: 0,
      ringScale: 1
    };

    let longPressTimer = null;
    let osDragging = false;
    let osDragExt = 'png';

    function isPointInFolder(px, py, pad = 0) {
      const hw = folder.w * 0.54 + pad;
      const hh = folder.h * 0.54 + pad;
      return Math.abs(px - folder.cx) <= hw && Math.abs(py - folder.cy) <= hh;
    }

    function isPointInDockPile(px, py) {
      if (folder.isOpen || dockPile.respawnAlpha < 0.4) return false;
      return Math.hypot(px - dockPile.x, py - dockPile.y) <= 42;
    }

    function closestEl(target, selector) {
      return (target && typeof target.closest === 'function') ? target.closest(selector) : null;
    }

    window.addEventListener('pointerdown', (e) => {
      if (closestEl(e.target, '#top-bar') || closestEl(e.target, '.card-item')) return;
      ensureAudio();

      pointer.isTouch = (e.pointerType === 'touch');
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      if (pointer.isTouch) {
        pointer.smoothX = e.clientX;
        pointer.smoothY = e.clientY;
      }
      pointer.active = true;
      pointer.isDown = true;
      pointer.downX = e.clientX;
      pointer.downY = e.clientY;
      pointer.downAt = performance.now();
      pointer.movedDist = 0;

      if (isPointInDockPile(e.clientX, e.clientY)) {
        dockPile.dragging = true;
        dockPile.x = e.clientX;
        dockPile.y = e.clientY;
        playCelesta(3, 0.03, 0.65);
        return;
      }

      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (pointer.isDown && !dockPile.dragging && pointer.movedDist < 26 && !folder.isOpen) {
          pointer.vortexActive = true;
          startVortexSound();
        }
      }, 240);
    });

    window.addEventListener('pointermove', (e) => {
      pointer.isTouch = (e.pointerType === 'touch');
      const prevX = pointer.x;
      const prevY = pointer.y;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.vx = (pointer.x - prevX) * 60;
      pointer.vy = (pointer.y - prevY) * 60;
      pointer.active = true;

      if (pointer.isDown) {
        pointer.movedDist = Math.hypot(pointer.x - pointer.downX, pointer.y - pointer.downY);
        if (pointer.movedDist > 26 && !pointer.vortexActive) {
          clearTimeout(longPressTimer);
        }
      }

      if (dockPile.dragging) {
        dockPile.x = pointer.x;
        dockPile.y = pointer.y;
        const near = isPointInFolder(pointer.x, pointer.y, 48);
        folder.isDragNear = near;
        document.body.classList.toggle('dragging-near', near);
      } else if (!osDragging) {
        folder.isHoverFolder = isPointInFolder(pointer.x, pointer.y, 12);
      }

      if (!dockPile.dragging && !pointer.vortexActive) {
        brushRosesAndVine(pointer.x, pointer.y, pointer.vx, pointer.vy);
        brushBackgroundLights(pointer.x, pointer.y, pointer.vx, pointer.vy);
      }
    });

    function finishPointerUp(e) {
      clearTimeout(longPressTimer);

      if (dockPile.dragging) {
        dockPile.dragging = false;
        const droppedIn = isPointInFolder(pointer.x, pointer.y, 48);
        folder.isDragNear = false;
        document.body.classList.remove('dragging-near');

        if (droppedIn) {
          addNewFile(dockPile.ext, dockPile.name);
          const nextItem = EXTRA_POOL[extraPoolIdx++ % EXTRA_POOL.length];
          dockPile.ext = nextItem.ext;
          dockPile.name = nextItem.name;
          dockPile.respawnAlpha = 0;
          dockPile.x = dockPile.homeX;
          dockPile.y = dockPile.homeY;
        }
        pointer.isDown = false;
        return;
      }

      if (pointer.vortexActive) {
        pointer.vortexActive = false;
        stopVortexSound(true);
        triggerVortexBurst();
        pointer.isDown = false;
        return;
      }

      const elapsed = performance.now() - pointer.downAt;
      if (pointer.isDown && elapsed < 320 && pointer.movedDist < 14) {
        if (!closestEl(e.target, '#top-bar') && !closestEl(e.target, '.card-item')) {
          if (folder.isOpen) {
            setFolderOpen(false);
          } else if (isPointInFolder(pointer.x, pointer.y, 20)) {
            setFolderOpen(true);
          }
        }
      }
      pointer.isDown = false;
    }

    window.addEventListener('pointerup', finishPointerUp);
    window.addEventListener('pointercancel', finishPointerUp);

    let lastTapBgAt = 0;
    window.addEventListener('dblclick', (e) => {
      if (!isPointInFolder(e.clientX, e.clientY, 30) && !closestEl(e.target, '#top-bar')) {
        document.body.classList.toggle('zen-mode');
      }
    });
    window.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        if (!isPointInFolder(t.clientX, t.clientY, 35) && !isPointInDockPile(t.clientX, t.clientY)) {
          const now = performance.now();
          if (now - lastTapBgAt < 300) {
            document.body.classList.toggle('zen-mode');
          }
          lastTapBgAt = now;
        }
      }
    }, { passive: true });

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      osDragging = true;
      folder.isDragNear = true;
      if (folder.isOpen) setFolderOpen(false);
      document.body.classList.add('dragging-near');
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      osDragging = true;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
      folder.isDragNear = true;
      document.body.classList.add('dragging-near');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= vw || e.clientY >= vh) {
        osDragging = false;
        folder.isDragNear = false;
        document.body.classList.remove('dragging-near');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      osDragging = false;
      folder.isDragNear = false;
      document.body.classList.remove('dragging-near');

      const droppedFiles = e.dataTransfer && e.dataTransfer.files;
      if (droppedFiles && droppedFiles.length > 0) {
        Array.from(droppedFiles).slice(0, 5).forEach((f, idx) => {
          const parts = f.name.split('.');
          const ext = parts.length > 1 ? parts.pop() : 'dat';
          const base = parts.join('.') || '圣咏残章';
          setTimeout(() => addNewFile(ext, base), idx * 180);
        });
      } else {
        const item = EXTRA_POOL[extraPoolIdx++ % EXTRA_POOL.length];
        addNewFile(item.ext, item.name);
      }
    });

    // Dual-Sanctuary Theme Switch (Opaline vs Crimson Gothic!)
    document.querySelectorAll('[data-theme]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const th = btn.dataset.theme;
        currentTheme = THEMES[th] || THEMES.opaline;
        document.body.classList.toggle('theme-crimson', th === 'crimson');
        document.body.classList.toggle('theme-opaline', th !== 'crimson');
        document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b === btn));
        rebuildBokehAndPetalSprites();
        // Gentle golden shimmer burst around roses on theme transmutation!
        roses.forEach((r, idx) => {
          if (idx < 5) {
            const p = getRoseWorldPos(r);
            for (let k = 0; k < 4; k++) {
              spawnParticle(p.x + (Math.random() - 0.5) * 36, p.y + (Math.random() - 0.5) * 36, 'goldspark');
            }
          }
        });
        playCelesta(th === 'crimson' ? 0 : 5, 0.038, 1.0);
        setTimeout(() => playCelesta(th === 'crimson' ? 3 : 8, 0.032, 1.15), 90);
      });
    });

    document.querySelectorAll('[data-font]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const f = btn.dataset.font;
        document.body.className = document.body.className.replace(/\bfont-v\d\b/g, '').trim();
        document.body.classList.add(`font-v${f}`);
        document.querySelectorAll('[data-font]').forEach(b => b.classList.toggle('active', b === btn));
        playCelesta(Number(f) + 1, 0.03, 0.7);
      });
    });

    const audioBtn = document.getElementById('btn-audio');
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audioEnabled = !audioEnabled;
      audioBtn.classList.toggle('active', audioEnabled);
      audioBtn.textContent = audioEnabled ? '音 · 开' : '音 · 静';
      if (audioEnabled) playCelesta(5, 0.035, 0.8);
    });

    function brushBackgroundLights(px, py, vx, vy) {
      const speed = Math.hypot(vx, vy);
      if (speed < 20) return;
      ambientBokeh.forEach((b) => {
        const d = Math.hypot(px - b.x, py - b.y);
        if (d < 150) {
          const w = (1 - d / 150) * 0.08 * b.depth;
          b.pushX += vx * w;
          b.pushY += vy * w;
        }
      });
      stardust.forEach((s) => {
        const d = Math.hypot(px - s.x, py - s.y);
        if (d < 110) {
          const w = (1 - d / 110) * 0.07 * s.depth;
          s.pushX += vx * w;
          s.pushY += vy * w;
        }
      });
    }

    let brushScatterCooldown = 0;
    function brushRosesAndVine(px, py, vx, vy) {
      const speed = Math.hypot(vx, vy);
      if (speed < 24) return;

      let touchedAny = false;
      roses.forEach((r) => {
        if (r.deepInside) return;
        const pos = getRoseWorldPos(r);
        const hitR = 68 * r.scale;
        const d = Math.hypot(px - pos.x, py - pos.y);
        if (d < hitR) {
          const falloff = 1 - d / hitR;
          r.velX += vx * 0.062 * falloff;
          r.velY += vy * 0.052 * falloff;
          r.angleVel += clamp(vx * 0.0006, -0.25, 0.25) * falloff;
          touchedAny = true;
        }
      });

      rightVine.nodes.forEach((nd, k) => {
        if (k === 0) return;
        const dn = Math.hypot(px - nd.x, py - nd.y);
        if (dn < 58) {
          const w = (1 - dn / 58) * (k / rightVine.nodes.length);
          nd.vx += vx * 0.055 * w;
          nd.vy += vy * 0.045 * w;
          touchedAny = true;
        }
      });

      const now = performance.now();
      if (touchedAny && speed > 130 && now - brushScatterCooldown > 52) {
        brushScatterCooldown = now;
        const count = Math.min(4, 1 + Math.floor(speed / 340));
        for (let i = 0; i < count; i++) {
          spawnParticle(
            px + (Math.random() - 0.5) * 28,
            py + (Math.random() - 0.5) * 28,
            i === 0 && Math.random() < 0.35 ? 'goldspark' : 'ambient'
          );
          particles[particles.length - 1].vx = vx * 0.14 + (Math.random() - 0.5) * 62;
          particles[particles.length - 1].vy = vy * 0.12 - 14 + Math.random() * 44;
        }
        if (speed > 250) playCelesta(-1, 0.025, 0.8);
      }
    }

    // =========================================================================
    // 10. PHYSICS STEP (Thorny Stems, Hanging Vine Pendulum, Petals & Bokeh)
    // =========================================================================
    let lastTime = performance.now();
    let ambientSpawnAcc = 0;

    function stepSimulation(now) {
      const dt = Math.min(0.033, Math.max(0.001, (now - lastTime) * 0.001));
      lastTime = now;
      const tSec = now * 0.001;

      pointer.smoothX += (pointer.x - pointer.smoothX) * Math.min(1, dt * 16);
      pointer.smoothY += (pointer.y - pointer.smoothY) * Math.min(1, dt * 16);

      const wantCursor = pointer.active && (!pointer.isTouch || pointer.isDown || pointer.vortexPower > 0.02);
      pointer.cursorAlpha += ((wantCursor ? 1 : 0) - pointer.cursorAlpha) * Math.min(1, dt * 10);

      if (pointer.vortexActive) {
        pointer.vortexPower = Math.min(1, pointer.vortexPower + dt * 2.4);
        pointer.ringScale += (0.56 - pointer.ringScale) * dt * 10;
        for (let i = 0; i < 5; i++) {
          spawnParticle(pointer.x, pointer.y, 'vortex');
        }
      } else {
        pointer.vortexPower = Math.max(0, pointer.vortexPower - dt * 3.5);
        const targetRing = pointer.isDown ? 0.82 : 1.0;
        pointer.ringScale += (targetRing - pointer.ringScale) * dt * 10;
      }

      if (folder.isOpen) {
        folder.targetOpenAngle = 72.5 * Math.PI / 180;
      } else if (folder.isDragNear) {
        folder.targetOpenAngle = 24.0 * Math.PI / 180;
      } else if (folder.isHoverFolder) {
        folder.targetOpenAngle = 16.5 * Math.PI / 180;
      } else {
        folder.targetOpenAngle = 10.5 * Math.PI / 180;
      }
      folder.openAngle += (folder.targetOpenAngle - folder.openAngle) * Math.min(1, dt * 9.5);

      const relX = clamp((pointer.smoothX - folder.cx) / (vw * 0.45), -1, 1);
      const relY = clamp((pointer.smoothY - folder.cy) / (vh * 0.45), -1, 1);
      const tiltScale = folder.isOpen ? 0.32 : 1.0;
      folder.targetTiltY = relX * 6.8 * (Math.PI / 180) * tiltScale;
      folder.targetTiltX = -relY * 5.2 * (Math.PI / 180) * tiltScale;
      folder.tiltX += (folder.targetTiltX - folder.tiltX) * Math.min(1, dt * 8);
      folder.tiltY += (folder.targetTiltY - folder.tiltY) * Math.min(1, dt * 8);

      const degOpen = (folder.openAngle * 180 / Math.PI) - (folder.tiltX * 180 / Math.PI);
      const degY = folder.tiltY * 180 / Math.PI;
      coverFaceEl.style.transform = `rotateX(${(-degOpen).toFixed(2)}deg) rotateY(${degY.toFixed(2)}deg)`;
      coverFaceEl.style.opacity = folder.isOpen ? '0.44' : '1';

      if (!dockPile.dragging) {
        const bobX = Math.sin(tSec * 1.35) * 3.2;
        const bobY = Math.cos(tSec * 1.05) * 4.2;
        dockPile.x += (dockPile.homeX + bobX - dockPile.x) * Math.min(1, dt * 9);
        dockPile.y += (dockPile.homeY + bobY - dockPile.y) * Math.min(1, dt * 9);
        dockPile.respawnAlpha = Math.min(1, dockPile.respawnAlpha + dt * 1.4);
      }

      if (pocketDropAnim) {
        pocketDropAnim.t += dt;
        if (pocketDropAnim.t >= pocketDropAnim.duration) {
          pocketDropAnim = null;
        }
      }

      // Gently shed occasional drifting crystal rose petals & golden sparks
      ambientSpawnAcc += dt;
      if (ambientSpawnAcc > 0.34 && !pointer.vortexActive) {
        ambientSpawnAcc = 0;
        const surfaceRoses = roses.filter(r => !r.deepInside);
        if (surfaceRoses.length > 0) {
          const rr = surfaceRoses[Math.floor(Math.random() * surfaceRoses.length)];
          const pos = getRoseWorldPos(rr);
          spawnParticle(
            pos.x + (Math.random() - 0.5) * 44,
            pos.y + (Math.random() - 0.5) * 34,
            Math.random() < 0.24 ? 'goldspark' : 'ambient'
          );
        }
      }

      const sf = folder.w / 392;

      // Update Right-Edge Cascading Thorny Vine Spring Chain
      const vineRootX = folder.cx + 0.44 * folder.w;
      const vineRootY = folder.cy - 0.38 * folder.h;
      const segLen = 22.5 * sf;

      if (!rightVine.initialized) {
        rightVine.nodes.forEach((nd, k) => {
          const ratio = k / (rightVine.nodes.length - 1);
          nd.x = vineRootX + Math.sin(ratio * 1.3) * 36 * sf;
          nd.y = vineRootY + k * segLen;
          nd.vx = 0;
          nd.vy = 0;
        });
        rightVine.initialized = true;
      } else {
        rightVine.nodes[0].x = vineRootX;
        rightVine.nodes[0].y = vineRootY;
        for (let k = 1; k < rightVine.nodes.length; k++) {
          const nd = rightVine.nodes[k];
          const prev = rightVine.nodes[k - 1];
          const ratio = k / (rightVine.nodes.length - 1);

          // Graceful S-curve outward bow + gentle cathedral breeze
          const curveBiasX = Math.cos(ratio * 1.8) * 32 * sf + Math.sin(tSec * 1.45 - k * 0.4) * (16 + ratio * 22) * sf;
          let gx = curveBiasX;
          let gy = (155 + ratio * 42) * sf;

          if (pointer.vortexPower > 0.01) {
            const dx = pointer.x - nd.x;
            const dy = pointer.y - nd.y;
            gx += dx * 3.8 * pointer.vortexPower;
            gy = gy * (1 - pointer.vortexPower * 0.84) + dy * 3.8 * pointer.vortexPower;
          }

          nd.vx += gx * dt;
          nd.vy += gy * dt;
          nd.vx *= Math.pow(0.05, dt);
          nd.vy *= Math.pow(0.05, dt);
          nd.x += nd.vx * dt;
          nd.y += nd.vy * dt;

          const dx = nd.x - prev.x;
          const dy = nd.y - prev.y;
          const dist = Math.hypot(dx, dy) || 0.0001;
          const diff = (dist - segLen) / dist;
          nd.x -= dx * diff * 0.86;
          nd.y -= dy * diff * 0.86;
          nd.vx -= dx * diff * 8.2;
          nd.vy -= dy * diff * 8.2;
        }
      }

      // Update Individual Roses (elastic woody-stem spring physics!)
      roses.forEach((r, idx) => {
        r.grow += (1 - r.grow) * Math.min(1, dt * 4.2);
        const swayX = Math.sin(tSec * r.breatheSpeed + r.phase) * (r.deepInside ? 2.2 : 4.2);
        const swayY = Math.cos(tSec * r.breatheSpeed * 0.85 + r.phase) * (r.deepInside ? 1.6 : 2.8);

        if (pointer.vortexPower > 0.01 && !r.deepInside) {
          const pos = getRoseWorldPos(r);
          const dx = pointer.x - pos.x;
          const dy = pointer.y - pos.y;
          r.velX += dx * 1.5 * pointer.vortexPower * dt;
          r.velY += dy * 1.5 * pointer.vortexPower * dt;
          r.angleVel += clamp(-dx * 0.004, -0.6, 0.6) * pointer.vortexPower * dt;
        }

        r.velX += ((swayX - r.dispX) * 16.0) * dt;
        r.velY += ((swayY - r.dispY) * 16.0) * dt;
        r.velX *= Math.pow(0.075, dt);
        r.velY *= Math.pow(0.075, dt);
        r.dispX += r.velX * dt;
        r.dispY += r.velY * dt;

        const breezeAng = Math.sin(tSec * 1.1 + idx * 0.9) * 0.048;
        r.angleVel += ((breezeAng - r.angleOffset) * 15.0) * dt;
        r.angleVel *= Math.pow(0.085, dt);
        r.angleOffset += r.angleVel * dt;
      });

      // Update Drifting Petals, Gold Sparks & Vortex Bokeh (Non-stalling air currents!)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        if (p.age >= p.life) {
          particles.splice(i, 1);
          continue;
        }

        if (pointer.vortexPower > 0.05) {
          const dx = pointer.x - p.x;
          const dy = pointer.y - p.y;
          const dist = Math.hypot(dx, dy) + 8;
          const pull = (290 + 4800 / (dist + 26)) * pointer.vortexPower;
          const swirl = (355 + 5600 / (dist + 22)) * pointer.vortexPower;
          p.vx += ((dx / dist) * pull - (dy / dist) * swirl) * dt;
          p.vy += ((dy / dist) * pull + (dx / dist) * swirl) * dt;
          p.vx *= Math.pow(0.18, dt);
          p.vy *= Math.pow(0.18, dt);
        } else {
          if (p.isGoldSpark) {
            p.vy -= 38 * dt;
            p.vx += Math.sin(tSec * 3.0 + i) * 32 * dt;
          } else {
            // Fluttering rose-petal aerodynamics: gentle swaying glide!
            const driftY = (i % 3 === 0) ? -22 : 30;
            p.vy += (driftY + Math.cos(tSec * 1.5 + i * 0.8) * 20) * dt;
            p.vx += Math.sin(tSec * 1.9 + i * 0.7) * 40 * dt;
          }
          p.vx *= Math.pow(0.74, dt);
          p.vy *= Math.pow(0.74, dt);
        }

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vRot * dt;
        p.flutterPhase += p.flutterSpeed * dt;
      }

      // Update Living Background Soft Bokeh Orbs & Droplets
      ambientBokeh.forEach((b) => {
        if (pointer.vortexPower > 0.04) {
          const dx = pointer.x - b.x;
          const dy = pointer.y - b.y;
          const dist = Math.hypot(dx, dy) + 30;
          b.pushX += ((dx / dist) * 85 - (dy / dist) * 125) * pointer.vortexPower * dt;
          b.pushY += ((dy / dist) * 85 + (dx / dist) * 125) * pointer.vortexPower * dt;
        }
        const waveVx = Math.cos(tSec * b.orbitFreq + b.phase) * b.orbitAmpX;
        const waveVy = Math.sin(tSec * b.orbitFreq * 0.8 + b.phase) * b.orbitAmpY;
        b.x += (b.vx + waveVx + b.pushX) * dt;
        b.y += (b.vy + waveVy + b.pushY) * dt;
        b.pushX *= Math.pow(0.25, dt);
        b.pushY *= Math.pow(0.25, dt);

        const pad = b.radius * 2.2 + 20;
        if (b.x < -pad) b.x = vw + pad;
        else if (b.x > vw + pad) b.x = -pad;
        if (b.y < -pad) b.y = vh + pad;
        else if (b.y > vh + pad) b.y = -pad;
      });

      // Update Floating Cathedral Gold & Rose Stardust
      stardust.forEach((s) => {
        if (pointer.vortexPower > 0.04) {
          const dx = pointer.x - s.x;
          const dy = pointer.y - s.y;
          const dist = Math.hypot(dx, dy) + 30;
          s.pushX += ((dx / dist) * 70 - (dy / dist) * 105) * pointer.vortexPower * dt;
          s.pushY += ((dy / dist) * 70 + (dx / dist) * 105) * pointer.vortexPower * dt;
        }
        const swayVx = Math.sin(tSec * s.swayFreq + s.phase) * s.swayAmp;
        s.x += (s.vx + swayVx + s.pushX) * dt;
        s.y += (s.vy + s.pushY) * dt;
        s.pushX *= Math.pow(0.25, dt);
        s.pushY *= Math.pow(0.25, dt);

        if (s.x < -12) s.x = vw + 12;
        else if (s.x > vw + 12) s.x = -12;
        if (s.y < -12) s.y = vh + 12;
        else if (s.y > vh + 12) s.y = -12;
      });
    }

    // =========================================================================
    // 11. PROCEDURAL BOTANICAL & VITRAIL ROSE RENDERING ENGINE
    // =========================================================================
    function projectCoverPoint(lx, ly, lz) {
      const cyHinge = folder.h * 0.5;
      const dy = ly - cyHinge;
      const rx = folder.openAngle - folder.tiltX;
      const cosX = Math.cos(rx);
      const sinX = Math.sin(rx);
      const y1 = cyHinge + dy * cosX - lz * sinX;
      const z1 = -dy * sinX + lz * cosX;

      const cosY = Math.cos(folder.tiltY);
      const sinY = Math.sin(folder.tiltY);
      const x2 = lx * cosY + z1 * sinY;
      const z2 = -lx * sinY + z1 * cosY;

      const P = folder.perspective;
      const k = P / Math.max(120, P - z2);
      return {
        x: folder.cx + x2 * k,
        y: folder.cy + y1 * k,
        k
      };
    }

    function drawRoundedQuadPath(g, tl, tr, br, bl, r) {
      function lerpPt(a, b, dist) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const t = Math.min(0.45, dist / len);
        return { x: a.x + dx * t, y: a.y + dy * t };
      }
      const tl1 = lerpPt(tl, bl, r);
      const tl2 = lerpPt(tl, tr, r);
      const tr1 = lerpPt(tr, tl, r);
      const tr2 = lerpPt(tr, br, r);
      const br1 = lerpPt(br, tr, r);
      const br2 = lerpPt(br, bl, r);
      const bl1 = lerpPt(bl, br, r);
      const bl2 = lerpPt(bl, tl, r);

      g.beginPath();
      g.moveTo(tl2.x, tl2.y);
      g.lineTo(tr1.x, tr1.y);
      g.quadraticCurveTo(tr.x, tr.y, tr2.x, tr2.y);
      g.lineTo(br1.x, br1.y);
      g.quadraticCurveTo(br.x, br.y, br2.x, br2.y);
      g.lineTo(bl1.x, bl1.y);
      g.quadraticCurveTo(bl.x, bl.y, bl2.x, bl2.y);
      g.lineTo(tl1.x, tl1.y);
      g.quadraticCurveTo(tl.x, tl.y, tl2.x, tl2.y);
      g.closePath();
    }

    // Serrated Dark-Emerald & Gold-Veined Rose Leaf Cluster (Compound 3-leaflet rose foliage!)
    function drawRoseLeafCluster(g, x, y, angle, scale, tSec) {
      const [dkR, dkG, dkB] = currentTheme.leafDark;
      const [ltR, ltG, ltB] = currentTheme.leafLight;
      const [gR, gG, gB] = currentTheme.goldStroke;

      g.save();
      g.translate(x, y);
      g.rotate(angle + Math.sin(tSec * 1.2 + x * 0.02) * 0.045);

      const leaflets = [
        { ang: 0,     len: 30 * scale, wid: 10.5 * scale, ox: 0, oy: 0 },
        { ang: -0.62, len: 21 * scale, wid: 8.0 * scale,  ox: -2 * scale, oy: 8 * scale },
        { ang: 0.62,  len: 21 * scale, wid: 8.0 * scale,  ox: 2 * scale,  oy: 8 * scale }
      ];

      leaflets.forEach((lf) => {
        g.save();
        g.translate(lf.ox, lf.oy);
        g.rotate(lf.ang);

        const lGrad = g.createLinearGradient(0, 0, lf.wid, -lf.len);
        lGrad.addColorStop(0, `rgba(${dkR}, ${dkG}, ${dkB}, 0.94)`);
        lGrad.addColorStop(0.65, `rgba(${ltR}, ${ltG}, ${ltB}, 0.88)`);
        lGrad.addColorStop(1, `rgba(${dkR}, ${dkG}, ${dkB}, 0.92)`);

        // Pointed rose leaflet with subtle serrated silhouette
        g.beginPath();
        g.moveTo(0, 0);
        g.bezierCurveTo(-lf.wid * 1.05, -lf.len * 0.28, -lf.wid * 0.95, -lf.len * 0.72, 0, -lf.len);
        g.bezierCurveTo(lf.wid * 0.95, -lf.len * 0.72, lf.wid * 1.05, -lf.len * 0.28, 0, 0);
        g.closePath();
        g.fillStyle = lGrad;
        g.fill();

        g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, 0.62)`;
        g.lineWidth = 0.85 * scale;
        g.stroke();

        // Gold midrib + lateral feather veins
        g.strokeStyle = currentTheme.leafVein;
        g.lineWidth = 0.75 * scale;
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(0, -lf.len * 0.92);
        for (let v = 1; v <= 3; v++) {
          const vy = -lf.len * (v * 0.22);
          const vw2 = lf.wid * (0.68 - v * 0.11);
          g.moveTo(0, vy);
          g.lineTo(-vw2, vy - 4 * scale);
          g.moveTo(0, vy);
          g.lineTo(vw2, vy - 4 * scale);
        }
        g.stroke();

        g.restore();
      });

      g.restore();
    }

    // Sharp Golden Rose Thorn along a stem segment (Image 3 & Image 4 signature detail!)
    function drawGoldenThorn(g, x, y, stemAngle, side, scale) {
      const [gR, gG, gB] = currentTheme.goldStroke;
      const [dR, dG, dB] = currentTheme.goldDeep;
      g.save();
      g.translate(x, y);
      g.rotate(stemAngle + (side > 0 ? Math.PI * 0.5 : -Math.PI * 0.5));

      const thLen = 7.5 * scale;
      g.fillStyle = `rgba(${gR}, ${gG}, ${gB}, 0.92)`;
      g.strokeStyle = `rgba(${dR}, ${dG}, ${dB}, 0.75)`;
      g.lineWidth = 0.6 * scale;

      g.beginPath();
      g.moveTo(-2.6 * scale, 0);
      g.quadraticCurveTo(0.5 * scale, -thLen * 0.55, 2.2 * scale, -thLen); // Hooked rose-thorn point!
      g.quadraticCurveTo(1.8 * scale, -thLen * 0.35, 2.8 * scale, 0);
      g.closePath();
      g.fill();
      g.stroke();
      g.restore();
    }

    // Draw Curved Golden Thorny Stem from Root to Rose Head + Foliage
    function drawThornyStemForRose(g, r, tSec) {
      if (r.isVineTip) return;
      const sf = (folder.w / 392) * r.grow;
      if (sf < 0.05) return;

      const x0 = folder.cx + r.rootX * folder.w;
      const y0 = folder.cy + r.rootY * folder.h;
      const pos = getRoseWorldPos(r);
      const x1 = pos.x;
      const y1 = pos.y;

      const midX = (x0 + x1) * 0.5 + (r.nx >= 0 ? -26 : 24) * sf;
      const midY = (y0 + y1) * 0.5 - 14 * sf;

      const [gR, gG, gB] = currentTheme.goldStroke;
      const [dR, dG, dB] = currentTheme.goldDeep;

      g.save();
      // Soft warm amber under-glow inside pocket so blurred frosted stems glow like Image 4 & Image 2!
      if (r.layer === 'pocket') {
        g.strokeStyle = `rgba(${gR}, ${gG}, ${gB}, ${r.deepInside ? 0.52 : 0.34})`;
        g.lineWidth = (r.deepInside ? 6.5 : 4.6) * sf;
        g.lineCap = 'round';
        g.beginPath();
        g.moveTo(x0, y0);
        g.quadraticCurveTo(midX, midY, x1, y1);
        g.stroke();
      }

      const stGrad = g.createLinearGradient(x0, y0, x1, y1);
      stGrad.addColorStop(0, `rgba(${dR}, ${dG}, ${dB}, 0.68)`);
      stGrad.addColorStop(0.55, `rgba(${gR}, ${gG}, ${gB}, 0.92)`);
      stGrad.addColorStop(1, `rgba(255, 242, 214, 0.96)`);

      g.strokeStyle = stGrad;
      g.lineWidth = (r.deepInside ? 3.2 : 2.35) * sf * Math.min(1.12, r.scale);
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(x0, y0);
      g.quadraticCurveTo(midX, midY, x1, y1);
      g.stroke();
      g.restore();

      function sampleQuad(t) {
        const mt = 1 - t;
        const px = mt * mt * x0 + 2 * mt * t * midX + t * t * x1;
        const py = mt * mt * y0 + 2 * mt * t * midY + t * t * y1;
        const tx = 2 * mt * (midX - x0) + 2 * t * (x1 - midX);
        const ty = 2 * mt * (midY - y0) + 2 * t * (y1 - midY);
        return { x: px, y: py, ang: Math.atan2(ty, tx) };
      }

      if (!r.deepInside) {
        [0.34, 0.58, 0.78].forEach((t, idx) => {
          const pt = sampleQuad(t);
          drawGoldenThorn(g, pt.x, pt.y, pt.ang, idx % 2 === 0 ? 1 : -1, sf * 0.94);
        });
      }

      r.leaves.forEach((side, idx) => {
        const t = idx === 0 ? 0.68 : 0.44;
        const pt = sampleQuad(t);
        drawRoseLeafCluster(
          g,
          pt.x,
          pt.y,
          pt.ang + Math.PI * 0.5 + side * 0.76,
          sf * Math.min(1.18, r.scale) * 0.88,
          tSec
        );
      });
    }

    // Lush Intertwined Cathedral Rose Bramble & Foliage Crown along the Folder Lip (Image 4 & Image 2 signature!)
    function drawCrownBramble(g, tSec, foregroundArchOnly = false) {
      if (roses.length === 0) return;
      const sf = folder.w / 392;
      const [gR, gG, gB] = currentTheme.goldStroke;
      const [dR, dG, dB] = currentTheme.goldDeep;
      const sway = Math.sin(tSec * 1.15) * 2.5 * sf;

      if (!foregroundArchOnly) {
        // 1) High Left-Center Emerald Rose-Leaf Spray rising gracefully behind Hero & Left Crown Roses!
        drawRoseLeafCluster(
          g,
          folder.cx - 0.01 * folder.w + sway,
          folder.cy - 0.66 * folder.h,
          -0.54,
          sf * 1.24,
          tSec
        );
        // 2) Right-Shoulder Sweeping Emerald Rose-Leaf Spray between Hero Rose & Right-Corner Rose!
        drawRoseLeafCluster(
          g,
          folder.cx + 0.33 * folder.w + sway * 0.8,
          folder.cy - 0.55 * folder.h,
          1.18,
          sf * 1.20,
          tSec
        );
        // 3) Tab-Crevice Emerald & Gold Leaf peeking right above the folder tab notch!
        drawRoseLeafCluster(
          g,
          folder.cx - 0.31 * folder.w,
          folder.cy - 0.48 * folder.h,
          -1.08,
          sf * 0.96,
          tSec
        );
        // 4) Center Lip Cushion Leaf
        drawRoseLeafCluster(
          g,
          folder.cx + 0.05 * folder.w,
          folder.cy - 0.49 * folder.h,
          0.72,
          sf * 0.92,
          tSec
        );
        return;
      }

      // Foreground Golden Thorny Arch curving across the top frosted-glass lip (Image 4 & Image 2 iconic detail!)
      g.save();
      const ax0 = folder.cx - 0.31 * folder.w;
      const ay0 = folder.cy - 0.47 * folder.h;
      const axm = folder.cx - 0.14 * folder.w;
      const aym = folder.cy - 0.59 * folder.h + sway * 0.5;
      const ax1 = folder.cx + 0.01 * folder.w;
      const ay1 = folder.cy - 0.48 * folder.h;

      const archGrad = g.createLinearGradient(ax0, ay0, ax1, ay1);
      archGrad.addColorStop(0, `rgba(${dR}, ${dG}, ${dB}, 0.62)`);
      archGrad.addColorStop(0.5, `rgba(255, 240, 208, 0.92)`);
      archGrad.addColorStop(1, `rgba(${gR}, ${gG}, ${gB}, 0.72)`);

      g.strokeStyle = archGrad;
      g.lineWidth = 2.0 * sf;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(ax0, ay0);
      g.quadraticCurveTo(axm, aym, ax1, ay1);
      g.stroke();

      // Secondary thorny twig bridging Hero Rose base toward Right-Corner Rose!
      const bx0 = folder.cx + 0.10 * folder.w;
      const by0 = folder.cy - 0.49 * folder.h;
      const bxm = folder.cx + 0.24 * folder.w;
      const bym = folder.cy - 0.54 * folder.h - sway * 0.4;
      const bx1 = folder.cx + 0.36 * folder.w;
      const by1 = folder.cy - 0.45 * folder.h;
      g.beginPath();
      g.moveTo(bx0, by0);
      g.quadraticCurveTo(bxm, bym, bx1, by1);
      g.stroke();

      drawGoldenThorn(g, folder.cx - 0.21 * folder.w, folder.cy - 0.525 * folder.h, -0.32, -1, sf * 0.85);
      drawGoldenThorn(g, folder.cx - 0.08 * folder.w, folder.cy - 0.525 * folder.h, 0.32, 1, sf * 0.85);
      drawGoldenThorn(g, folder.cx + 0.22 * folder.w, folder.cy - 0.515 * folder.h, 0.12, -1, sf * 0.90);
      g.restore();
    }

    // Draw the Cascading Right-Edge Thorny Vine + Serrated Leaves
    function drawRightCascadingVine(g, tSec) {
      if (!rightVine.initialized) return;
      const sf = folder.w / 392;
      const nodes = rightVine.nodes;
      const [gR, gG, gB] = currentTheme.goldStroke;
      const [dR, dG, dB] = currentTheme.goldDeep;

      g.save();
      const vGrad = g.createLinearGradient(nodes[0].x, nodes[0].y, nodes[nodes.length - 1].x, nodes[nodes.length - 1].y);
      vGrad.addColorStop(0, `rgba(${gR}, ${gG}, ${gB}, 0.94)`);
      vGrad.addColorStop(0.7, `rgba(${gR}, ${gG}, ${gB}, 0.86)`);
      vGrad.addColorStop(1, `rgba(${dR}, ${dG}, ${dB}, 0.80)`);

      g.strokeStyle = vGrad;
      g.lineWidth = 2.15 * sf;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(nodes[0].x, nodes[0].y);
      for (let k = 1; k < nodes.length - 1; k++) {
        const xc = (nodes[k].x + nodes[k + 1].x) * 0.5;
        const yc = (nodes[k].y + nodes[k + 1].y) * 0.5;
        g.quadraticCurveTo(nodes[k].x, nodes[k].y, xc, yc);
      }
      g.lineTo(nodes[nodes.length - 1].x, nodes[nodes.length - 1].y);
      g.stroke();
      g.restore();

      // Leaves & Golden Thorns along the cascading right vine (matching Image 4 & Image 2!)
      for (let k = 1; k < nodes.length - 1; k++) {
        const prev = nodes[k - 1];
        const next = nodes[k + 1];
        const ang = Math.atan2(next.y - prev.y, next.x - prev.x);
        if (k === 2 || k === 4 || k === 6) {
          drawGoldenThorn(g, nodes[k].x, nodes[k].y, ang, k % 4 === 0 ? -1 : 1, sf * 0.92);
        }
        if (k === 2) {
          drawRoseLeafCluster(g, nodes[k].x, nodes[k].y, ang - 0.62, sf * 1.02, tSec);
        } else if (k === 4) {
          drawRoseLeafCluster(g, nodes[k].x, nodes[k].y, ang + 2.22, sf * 1.04, tSec);
        } else if (k === 5) {
          drawRoseLeafCluster(g, nodes[k].x, nodes[k].y, ang - 0.82, sf * 0.84, tSec);
        }
      }
    }

    // Helper: Mix two RGB arrays
    function mixRGB(a, b, t) {
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t)
      ];
    }

    // Helper: Draw a Single Translucent Gold-Filigree Stained-Glass Rose Petal (Lush rounded rose shoulder + delicate cusp!)
    function drawVitrailPetal(g, opts) {
      const {
        ox = 0, oy = 0, angle = 0, distY = 0, w, h, topRGB, botRGB, goldRGB,
        alphaTop = 0.92, alphaBot = 0.84, pointed = 1.0, tracery = false, sf = 1
      } = opts;

      g.save();
      g.translate(ox, oy);
      g.rotate(angle);
      g.translate(0, distY);

      const midRGB = mixRGB(topRGB, botRGB, 0.46);
      const pGrad = g.createLinearGradient(0, -h, 0, h * 0.16);
      pGrad.addColorStop(0.0, `rgba(${Math.min(255, topRGB[0] + 22)}, ${Math.min(255, topRGB[1] + 18)}, ${Math.min(255, topRGB[2] + 18)}, ${alphaTop})`);
      pGrad.addColorStop(0.36, `rgba(${topRGB[0]}, ${topRGB[1]}, ${topRGB[2]}, ${alphaTop * 0.96})`);
      pGrad.addColorStop(0.72, `rgba(${midRGB[0]}, ${midRGB[1]}, ${midRGB[2]}, ${(alphaTop + alphaBot) * 0.48})`);
      pGrad.addColorStop(1.0, `rgba(${botRGB[0]}, ${botRGB[1]}, ${botRGB[2]}, ${alphaBot})`);

      // Voluptuous rounded-heart English/Gothic rose petal with a delicate rolled mucronate cusp!
      const shoulderW = w * (pointed > 1.2 ? 0.42 : 0.72);
      const cuspLift = pointed > 1.2 ? 0.08 : 0.045;
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(-w * 1.12, -h * 0.14, -w * 1.22, -h * 0.78, -shoulderW, -h * 0.96);
      g.quadraticCurveTo(-shoulderW * 0.35, -h * 1.01, 0, -h * (1.0 + cuspLift));
      g.quadraticCurveTo(shoulderW * 0.35, -h * 1.01, shoulderW, -h * 0.96);
      g.bezierCurveTo(w * 1.22, -h * 0.78, w * 1.12, -h * 0.14, 0, 0);
      g.closePath();

      g.fillStyle = pGrad;
      g.fill();

      // Specular inner crystal highlight + Champagne-Gold Lead-Caming Outer Rim (stroked BEFORE vein beginPath!)
      g.strokeStyle = 'rgba(255, 250, 242, 0.34)';
      g.lineWidth = 1.35 * sf;
      g.stroke();

      g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, 0.90)`;
      g.lineWidth = 0.88 * sf;
      g.stroke();

      // Whisper-delicate Stained-Glass Cathedral Veins inside outer/mid petals!
      if (tracery) {
        g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, ${currentTheme.filigree ? 0.32 : 0.18})`;
        g.lineWidth = 0.48 * sf;
        g.beginPath();
        g.moveTo(0, -h * 0.10);
        g.quadraticCurveTo(w * 0.05, -h * 0.52, 0, -h * 0.94);
        g.moveTo(0, -h * 0.32);
        g.quadraticCurveTo(-w * 0.44, -h * 0.54, -w * 0.74, -h * 0.78);
        g.moveTo(0, -h * 0.32);
        g.quadraticCurveTo(w * 0.44, -h * 0.54, w * 0.74, -h * 0.78);
        if (currentTheme.filigree) {
          // Subtle gothic pointed-ogive lattice in Crimson Nocturne mode (Image 2 homage!)
          g.moveTo(-w * 0.54, -h * 0.62);
          g.quadraticCurveTo(0, -h * 0.88, w * 0.54, -h * 0.62);
        }
        g.stroke();
      }

      g.restore();
    }

    // Helper: Draw a Broad FRONT-FACING Cupped Bowl Petal (curves upward across the rose heart for true 3D bowl depth!)
    function drawFrontCuppedPetal(g, opts) {
      const {
        cx = 0, topY, botY, halfW, rimRGB, midRGB, bellyRGB, goldRGB, tilt = 0, sf = 1
      } = opts;

      g.save();
      g.translate(cx, (topY + botY) * 0.5);
      g.rotate(tilt);
      const h = botY - topY;
      const yTop = -h * 0.5;
      const yBot = h * 0.5;

      // Top lip catches warm candlelit/ruby inner glow; lower curved belly falls into deep velvet shadow!
      const cGrad = g.createLinearGradient(0, yTop - 2 * sf, 0, yBot);
      cGrad.addColorStop(0.0, `rgba(${Math.min(255, rimRGB[0] + 22)}, ${Math.min(255, rimRGB[1] + 16)}, ${Math.min(255, rimRGB[2] + 16)}, 0.95)`);
      cGrad.addColorStop(0.35, `rgba(${midRGB[0]}, ${midRGB[1]}, ${midRGB[2]}, 0.93)`);
      cGrad.addColorStop(1.0, `rgba(${bellyRGB[0]}, ${bellyRGB[1]}, ${bellyRGB[2]}, 0.92)`);

      g.beginPath();
      // Soft rolled rose-petal upper lip curving gently across the front of the chalice
      g.moveTo(-halfW, yTop + h * 0.20);
      g.bezierCurveTo(-halfW * 0.62, yTop - h * 0.12, -halfW * 0.18, yTop - h * 0.08, 0, yTop - h * 0.14);
      g.bezierCurveTo(halfW * 0.18, yTop - h * 0.08, halfW * 0.62, yTop - h * 0.12, halfW, yTop + h * 0.20);
      // Rounded cupped belly wrapping smoothly down to the receptacle base
      g.bezierCurveTo(halfW * 0.96, yBot * 0.84, halfW * 0.38, yBot, 0, yBot);
      g.bezierCurveTo(-halfW * 0.38, yBot, -halfW * 0.96, yBot * 0.84, -halfW, yTop + h * 0.20);
      g.closePath();

      g.fillStyle = cGrad;
      g.fill();

      // Luminous rolled top-lip highlight + Gold filigree outer rim (stroked BEFORE mid-vein beginPath!)
      g.strokeStyle = 'rgba(255, 250, 240, 0.36)';
      g.lineWidth = 1.3 * sf;
      g.stroke();

      g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, 0.92)`;
      g.lineWidth = 0.88 * sf;
      g.stroke();

      // Whisper-subtle organic curved mid-vein
      g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, ${currentTheme.filigree ? 0.26 : 0.14})`;
      g.lineWidth = 0.45 * sf;
      g.beginPath();
      g.moveTo(0, yTop - h * 0.10);
      g.quadraticCurveTo(halfW * 0.06, 0, 0, yBot * 0.92);
      g.stroke();

      g.restore();
    }

    // Master Procedural Rose Head Renderer ('full' | 'semi' | 'bud') — 3/4 Depth-Sorted Cathedral Vitrail Rose!
    function drawOneRoseHead(g, r, tSec) {
      const sf = (folder.w / 392) * r.scale * r.grow;
      if (sf < 0.04) return;

      const pos = getRoseWorldPos(r);
      let headAngle = r.baseAngle + r.angleOffset;
      if (r.isVineTip && rightVine.initialized) {
        const nLast = rightVine.nodes[rightVine.nodes.length - 1];
        const nPrev = rightVine.nodes[rightVine.nodes.length - 2];
        headAngle = Math.atan2(nLast.y - nPrev.y, nLast.x - nPrev.x) - Math.PI * 0.5 + Math.PI;
      }

      const pal = currentTheme.roseVariants[r.varIdx % currentTheme.roseVariants.length];
      const goldRGB = currentTheme.goldStroke;
      const [dkR, dkG, dkB] = currentTheme.leafDark;
      const pulse = Math.sin(tSec * r.breatheSpeed + r.phase);
      const openBreath = 1 + pulse * 0.032;

      g.save();
      g.translate(pos.x, pos.y);
      g.rotate(headAngle);

      // 0) Sub-Surface Stained-Glass Aura (Compact jewel-toned dual-color bloom for `deepInside` frosted pocket roses!)
      if (r.deepInside) {
        const rBlue = 34 * sf;
        const gBlue = g.createRadialGradient(-14 * sf, -6 * sf, 2 * sf, -12 * sf, -5 * sf, rBlue);
        gBlue.addColorStop(0, `rgba(${pal.outerTop[0]}, ${pal.outerTop[1]}, ${pal.outerTop[2]}, 0.78)`);
        gBlue.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = gBlue;
        g.beginPath();
        g.arc(-12 * sf, -5 * sf, rBlue, 0, Math.PI * 2);
        g.fill();

        const rPink = 38 * sf;
        const gPink = g.createRadialGradient(8 * sf, -5 * sf, 2 * sf, 6 * sf, -4 * sf, rPink);
        gPink.addColorStop(0, `rgba(${pal.innerTop[0]}, ${pal.innerTop[1]}, ${pal.innerTop[2]}, 0.88)`);
        gPink.addColorStop(0.55, `rgba(${pal.midTop[0]}, ${pal.midTop[1]}, ${pal.midTop[2]}, 0.42)`);
        gPink.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = gPink;
        g.beginPath();
        g.arc(6 * sf, -4 * sf, rPink, 0, Math.PI * 2);
        g.fill();
      } else {
        const auraR = (r.kind === 'bud' ? 32 : 52) * sf;
        const aura = g.createRadialGradient(0, -6 * sf, 2 * sf, 0, -4 * sf, auraR);
        aura.addColorStop(0, pal.aura);
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = aura;
        g.beginPath();
        g.arc(0, -4 * sf, auraR, 0, Math.PI * 2);
        g.fill();
      }

      if (r.kind === 'bud') {
        // ===============================================================
        // GRACEFUL PLUMP VITRAIL ROSEBUD (High Bud & Hanging Pendant Bud!)
        // ===============================================================
        // Optional dainty trailing thorny tendril at tip of hanging pendant bud (Image 4 & Image 2 detail!)
        if (r.isVineTip) {
          g.save();
          g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, 0.86)`;
          g.lineWidth = 1.35 * sf;
          g.beginPath();
          g.moveTo(2 * sf, -28 * sf);
          g.quadraticCurveTo(10 * sf, -38 * sf, 5 * sf, -48 * sf);
          g.stroke();
          drawGoldenThorn(g, 7 * sf, -38 * sf, -1.3, 1, sf * 0.65);
          g.restore();
        }

        // Outer furled stained-glass guard petals (Cerulean/Sapphire & Lavender/Amethyst)
        drawVitrailPetal(g, {
          ox: -2 * sf, oy: 2 * sf, angle: -0.28 * openBreath, w: 13.5 * sf, h: 33 * sf,
          topRGB: pal.outerTop, botRGB: pal.outerBot, goldRGB, pointed: 1.22, tracery: true, sf
        });
        drawVitrailPetal(g, {
          ox: 2 * sf, oy: 2 * sf, angle: 0.28 * openBreath, w: 13.5 * sf, h: 33 * sf,
          topRGB: pal.midTop, botRGB: pal.midBot, goldRGB, pointed: 1.22, tracery: true, sf
        });
        // Inner glowing pointed rosebud cone
        drawVitrailPetal(g, {
          ox: -1 * sf, oy: 1 * sf, angle: -0.10, w: 12.5 * sf, h: 35.5 * sf,
          topRGB: pal.innerTop, botRGB: pal.innerBot, goldRGB, pointed: 1.32, tracery: false, sf
        });
        drawVitrailPetal(g, {
          ox: 1.5 * sf, oy: 1 * sf, angle: 0.10, w: 12 * sf, h: 35 * sf,
          topRGB: pal.coreGlow, botRGB: pal.innerBot, goldRGB, pointed: 1.32, tracery: false, sf
        });
        // Front cupped outer wrap petal hugging lower belly of the bud
        drawFrontCuppedPetal(g, {
          cx: 0, topY: -16 * sf, botY: 5 * sf, halfW: 11.5 * sf,
          rimRGB: pal.innerTop, midRGB: pal.midTop, bellyRGB: pal.outerBot, goldRGB, sf
        });

        // Graceful recurved Emerald & Gold Calyx Sepals hugging the bud!
        [-0.54, 0, 0.54].forEach((sa, idx) => {
          g.save();
          g.rotate(sa);
          const sepH = (idx === 1 ? 21 : 28) * sf;
          g.fillStyle = `rgba(${dkR}, ${dkG}, ${dkB}, 0.92)`;
          g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, 0.88)`;
          g.lineWidth = 0.85 * sf;
          g.beginPath();
          g.moveTo(-3.4 * sf, 5 * sf);
          g.bezierCurveTo(-4.8 * sf, -sepH * 0.36, -1.6 * sf, -sepH * 0.78, (idx - 1) * 3.5 * sf, -sepH);
          g.bezierCurveTo(1.6 * sf, -sepH * 0.78, 4.8 * sf, -sepH * 0.36, 3.4 * sf, 5 * sf);
          g.closePath();
          g.fill();
          g.stroke();
          g.restore();
        });

        g.restore();
        return;
      }

      // =====================================================================
      // 6-LAYER 3/4 CUPPED CATHEDRAL VITRAIL ROSE ('full' & 'semi')
      // Wide foreshortened bowl + asymmetric cool-to-warm stained glass + spiral heart + front cupped petals!
      // =====================================================================
      const kSemi = r.kind === 'semi' ? 0.86 : 1.0;

      // Subtle calyx sepals peeking beneath base of rose cup
      [-0.95, 0.95].forEach((sa) => {
        g.save();
        g.translate(0, 10 * sf);
        g.rotate(sa);
        g.fillStyle = `rgba(${dkR}, ${dkG}, ${dkB}, 0.88)`;
        g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, 0.78)`;
        g.lineWidth = 0.8 * sf;
        g.beginPath();
        g.moveTo(-3.2 * sf, 0);
        g.quadraticCurveTo(0, -24 * sf, sa > 0 ? 4 * sf : -4 * sf, -34 * sf * kSemi);
        g.quadraticCurveTo(3.2 * sf, -18 * sf, 3.2 * sf, 0);
        g.closePath();
        g.fill();
        g.stroke();
        g.restore();
      });

      // LAYER 1: BACK & WING OUTER GUARD PETALS (Wide horizontal spread + asymmetric cerulean-to-lavender iridescence!)
      const warmWingTop = mixRGB(pal.midTop, pal.innerTop, 0.35);
      const warmWingBot = mixRGB(pal.midBot, pal.innerBot, 0.35);
      const backGuardSpecs = [
        // Upper-back center crown petal
        { ox: -2 * sf,  oy: -4 * sf, ang: -0.14, w: 20 * sf * kSemi, h: 38 * sf * kSemi, top: mixRGB(pal.outerTop, pal.midTop, 0.5), bot: pal.midBot, pt: 0.92 },
        // Upper-left cool cerulean/sapphire cathedral petal (Image 4 & Image 2 left-wing signature!)
        { ox: -9 * sf,  oy: -3 * sf, ang: -0.66, w: 21.5 * sf * kSemi, h: 41 * sf * kSemi, top: pal.outerTop, bot: pal.outerBot, pt: 1.02 },
        // Upper-right opaline-lilac / royal-amethyst petal
        { ox: 8 * sf,   oy: -3 * sf, ang: 0.54,  w: 21.5 * sf * kSemi, h: 40 * sf * kSemi, top: pal.midTop, bot: pal.midBot, pt: 0.98 },
        // Sweeping Far-Left Wing Guard Petal (rich stained-glass blue!)
        { ox: -12 * sf, oy: 3 * sf,  ang: -1.24, w: 21 * sf * kSemi, h: 43 * sf * kSemi, top: pal.outerTop, bot: pal.outerBot, pt: 1.15 },
        // Sweeping Far-Right Wing Guard Petal (warm blush-violet / burgundy-amethyst!)
        { ox: 12 * sf,  oy: 3 * sf,  ang: 1.22,  w: 21 * sf * kSemi, h: 43 * sf * kSemi, top: warmWingTop, bot: warmWingBot, pt: 1.18 }
      ];
      backGuardSpecs.forEach((sp) => {

      // LAYER 2: BACK & SIDE MIDDLE CUPPED PETALS (Framing the upper chalice!)
      const midSpecs = [

        { ox: -4 * sf, oy: -2 * sf, ang: -0.32, w: 18 * sf * kSemi,   h: 31 * sf * kSemi, top: pal.midTop, bot: pal.innerBot },
        { ox: 4 * sf,  oy: -2 * sf, ang: 0.30,  w: 18 * sf * kSemi,   h: 31 * sf * kSemi, top: mixRGB(pal.midTop, pal.innerTop, 0.55), bot: pal.innerBot }
      ];
      midSpecs.forEach((mp) => {
        drawVitrailPetal(g, {
          ox: mp.ox, oy: mp.oy,

          w: mp.w,
          h: mp.h,

          tracery: true,

      // LAYER 3: INNER CHALICE CANDLELIT / RUBY SUB-SURFACE GLOW (Illuminates inside of cup BEFORE front petals!)
      g.save();
      g.globalCompositeOperation = 'screen';
      const chaliceGlow = g.createRadialGradient(0, -10 * sf, 1 * sf, 0, -9 * sf, 22 * sf * kSemi);
      chaliceGlow.addColorStop(0.0, `rgba(${pal.coreGlow[0]}, ${pal.coreGlow[1]}, ${pal.coreGlow[2]}, 0.76)`);
      chaliceGlow.addColorStop(0.52, `rgba(${pal.innerTop[0]}, ${pal.innerTop[1]}, ${pal.innerTop[2]}, 0.38)`);
      chaliceGlow.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      g.fillStyle = chaliceGlow;
      g.beginPath();
      g.arc(0, -9 * sf, 22 * sf * kSemi, 0, Math.PI * 2);
      g.fill();
      g.restore();

      // LAYER 4: IMBRICATED SPIRAL ROSE HEART (True overlapping curled inner petals — ZERO flat target ellipse!)
      // 4a. Back-left & back-right tightly cupped inner shell petals
      drawVitrailPetal(g, {
        ox: -3 * sf, oy: 2 * sf, angle: -0.44, w: 13.2 * sf * kSemi, h: 24.5 * sf * kSemi,
        topRGB: pal.innerTop, botRGB: pal.innerBot, goldRGB, alphaTop: 0.95, alphaBot: 0.88, pointed: 0.82, tracery: false, sf
      });
      drawVitrailPetal(g, {
        ox: 3 * sf, oy: 2 * sf, angle: 0.42, w: 13.2 * sf * kSemi, h: 24.5 * sf * kSemi,
        topRGB: pal.innerTop, botRGB: pal.innerBot, goldRGB, alphaTop: 0.95, alphaBot: 0.88, pointed: 0.82, tracery: false, sf
      });
      // 4b. Central glowing pointed bud-cone inside the spiral heart
      drawVitrailPetal(g, {
        ox: 0, oy: 3 * sf, angle: 0.02, w: 11.8 * sf * kSemi, h: 25 * sf * kSemi,

      });
      // 4c. Interlocking left & right spiral-swirl inner petals folding across the bud-cone!
      [-1, 1].forEach((dir) => {

        spGrad.addColorStop(0.45, `rgba(${pal.innerTop[0]}, ${pal.innerTop[1]}, ${pal.innerTop[2]}, 0.92)`);
        spGrad.addColorStop(1, `rgba(${pal.innerBot[0]}, ${pal.innerBot[1]}, ${pal.innerBot[2]}, 0.90)`);

        g.beginPath();
        g.moveTo(-dir * 9.5 * sf * kSemi, 2 * sf);
        g.bezierCurveTo(-dir * 7 * sf * kSemi, -9.5 * sf * kSemi, dir * 4 * sf * kSemi, -10.5 * sf * kSemi, dir * 8.5 * sf * kSemi, -1 * sf);
        g.bezierCurveTo(dir * 7 * sf * kSemi, 7.5 * sf * kSemi, -dir * 3 * sf * kSemi, 9 * sf * kSemi, -dir * 9.5 * sf * kSemi, 2 * sf);
        g.closePath();
        g.fillStyle = spGrad;
        g.fill();
        g.strokeStyle = `rgba(${goldRGB[0]}, ${goldRGB[1]}, ${goldRGB[2]}, 0.94)`;

        g.stroke();
        g.restore();
      });

      // LAYER 5: FRONT CUPPED BOWL PETALS (Sweeping upward across the lower half of the heart — true 3/4 rose depth!)
      drawFrontCuppedPetal(g, {
        cx: -10.5 * sf * kSemi,
        topY: -7.5 * sf * kSemi,
        botY: 12.5 * sf * kSemi,

      });
      drawFrontCuppedPetal(g, {
        cx: 10.5 * sf * kSemi,
        topY: -7.5 * sf * kSemi,
        botY: 12.5 * sf * kSemi,
        halfW: 13.5 * sf * kSemi,

      });
      // Center-front primary chalice petal cradling the glowing rose throat!
      drawFrontCuppedPetal(g, {
        cx: 0.5 * sf,
        topY: -5.5 * sf * kSemi,
        botY: 15.5 * sf * kSemi,
        halfW: 15.5 * sf * kSemi,

      // LAYER 6: LOWER-FRONT REFLEXED GUARD PETALS (Graceful rolled-back outer petals at base of rose!)
      if (r.kind === 'full') {
        drawVitrailPetal(g, {
          ox: -13 * sf, oy: 7 * sf, angle: -2.02 * openBreath,

        });
        // Center-bottom reflexed guard lip petal
        drawVitrailPetal(g, {
